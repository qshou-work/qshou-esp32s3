project:
  name: "Y71t Remote KVM-Lite"
  version: "1.9.2"
  description: >
    基于 ESP32-S3 的低成本远程控制方案，通过摄像头拍屏 + BLE HID 输入
    实现对 vivo Y71t 的异地看屏与点击操作。不依赖 ADB、不装 APP、
    不要求被控端有视频输出接口。
    核心工程难点在于三级坐标系（摄像头画面像素 → 屏幕物理像素 → HID 逻辑坐标）
    的标定与换算，该链路在 MVP 中不可省略。
  author: "user"
  created: "2026-09-28"
  updated: "2026-09-29 12:18:39 +08:00"
  status: "MVP"
  current_priority: "跑通第一：先让链路端到端可用，网络与算力开销一律跑通后再优化"

# ------------------------------------------------------------
# 执行策略 —— 当前阶段的取舍原则与已挂起项
# ------------------------------------------------------------
execution_policy:
  principle: >
    **跑通第一。** 在端到端链路打通之前，任何以"降低成本 / 降低开销 / 提高优雅度"
    为目标的方案都不进入实施清单。网络路径优化与算力开销优化统一推迟到跑通之后。
  rationale: >
    v1.5-v1.7 连续三轮都在做架构层面的前瞻设计（可插拔传输、P2P 优先、三级降级、
    UDP 分片、打洞成功率测算）。这些本身成立，但会显著拉长首次跑通的时间，
    且其中关键的打洞成功率在真实网络下本就测不准 ——
    在没跑通之前优化一个尚未存在的链路，是本末倒置。
  decision_date: "2026-09-29"
  decided_by: "用户"

  mvp_transport_decision:
    choice: "MVP 采用最简单的全量中转：ESP32 主动出站连 broker，视频与指令都经 broker，走 TCP/WebSocket"
    why: >
      完全复用现有 MVP 设计（WebSocket 图传 + HTTP API），改动最小、依赖最少、排障最直接。
      P2P / 三级降级 / UDP 分片所省的是"规模化的钱"，而规模在跑通之前并不存在。
    consequence: "MVP 阶段 broker 承载全部流量 —— 这在只有少量测试设备时成本可忽略"

  deferred_until_after_first_run:
    - item: "P2P 优先与三级降级（IPv6 直连 / IPv4 打洞 / 中继）"
      parked_from: "broker_service.transport_architecture"
      reason: "属成本优化，非跑通前提"
    - item: "UDP 分片与整帧丢弃策略"
      parked_from: "broker_service.transport_architecture.udp_fragmentation"
      reason: "是改走 P2P 后才产生的问题，随 P2P 一并推迟"
    - item: "打洞成功率与中继占比的专项测量"
      parked_from: "R21"
      reason: "测的是一个跑通后才存在的链路"
    - item: "带宽成本模型与免费额度设计"
      parked_from: "broker_service.economics"
      reason: "用户规模未知前无法有效建模"
    - item: "传输层多后端抽象的完整实现"
      parked_from: "implementation_order.step_8b"
      reason: "只保留接口与单一后端实现，不实现多后端"

  guardrails:
    # 说明："先跑通"不等于"什么都不管"。以下三项不阻塞跑通，
    # 但在官方 broker 承载真实用户之前必须完成 —— 它们是开放的前置条件，不是优化项。
    # （此处必须是纯列表，不能再混排 mapping key，否则 YAML 解析失败）
    - item: "端到端加密（R20）"
      when: "官方 broker 开始承载真实用户之前"
      note: "MVP 内测阶段可用 TLS + 每设备 token 过渡，但不得对外开放"
    - item: "合规与运营可持续性（R19）"
      when: "服务正式对外开放之前"
      note: "备案、隐私政策、商业模式都属开放前置条件"
    - item: "每设备唯一凭据"
      when: "设备数超过手工管理规模之前"
      note: "单台调试阶段可用人工录入，两台以上就该做"

  re_evaluate_trigger: >
    当端到端链路已稳定跑通、且出现下列任一情况时，重新启用上述挂起项：
    broker 带宽成本成为实际支出项 / 用户数增长到中继占比有意义 /
    或视频延迟在中继路径下不可接受。

# ------------------------------------------------------------
# 被控端（Y71t）一次性准备清单 —— 不做这些，后续全部无法验证
# ------------------------------------------------------------
android_prep:
  mandatory: true
  note: "以下设置在 LT 部署前一次性完成，并写入项目 README 以免重复踩坑"

  display:
    - "开发者选项 → 打开「指针位置」(Pointer location)：用于验证点击落点，是坐标链路的唯一地面真值来源"
    - "设置 → 显示 → 自动息屏改为「永不」或最长档"
    - "亮度手动拉满 + 关闭自动亮度/护眼模式（滤蓝光会改变画面色调，影响图像比对基线）"
    - "关闭深色主题或改为浅色主题：AMOLED 深色界面在摄像头下难以辨识边界"

  bluetooth:
    checklist:
      - "蓝牙保持常开，完成与 ESP32 的一次配对"
      - "OriginOS 电池优化 → 将蓝牙/相关系统服务加入白名单，作为对激进省电策略的保险"
      - "配对完成后在『已配对设备』里确认该设备归类为输入设备（否则后续 tap 可能无效）"

    screen_off_behavior:
      status: "RESOLVED (desk) — 息屏不会导致 BLE HID 断连"
      conclusion: >
        【Q4 结案】结论是「会保持」。关键在于分清两个层次：
        BLE 物理连接由独立的蓝牙控制器维持（该控制器有自己的供电域与内存，
        主机休眠时仍能保活连接并按需唤醒主机，这正是耳机/手表在息屏时不断连的同一套机制）；
        而 HOGP 输入由 Android 系统蓝牙栈处理，不是某个 App 持有的 GATT 连接。
        开发者文档里罗列的 Doze / App Standby / 前台服务等后台限制，约束的是
        App 进程发起的 BLE 操作，与本场景无关——不要被那些文档误导。
      residual_risks:
        - "OEM 侧激进省电（OriginOS）：白名单仍是必要保险，虽不再是主因"
        - "真正未定的不是『连不连得上』，而是『熄屏后 HID 触控能否把屏幕唤醒』：
           外部键盘按键通常能唤醒，但触控类输入是否可靠触发亮屏因 ROM 而异"
        - "BLE supervisor timeout：ESP32 侧不要长期静默不发任何包，空闲时也应维持链路"
      policy: >
        因此策略维持「屏幕常亮为主」，不去赌息屏唤醒。
        息屏只作为省电降级手段，且启用前必须跑通下面的验证项。
      verification_required:
        - "熄屏 30 分钟后发送一次 HID tap，记录：连接是否还在 / 屏幕是否被唤醒 / tap 是否生效"
        - "若 (a) 连接断：补串口日志看是 ESP32 侧还是 Y71t 侧发起的断连"
        - "若 (b) 未唤醒但连接还在：说明触控不触发唤醒，此时必须回退到常亮策略"

  lockdown:
    - "关闭锁屏密码/指纹，或设为滑动解锁：否则黑屏状态下摄像头看不到内容且无法操作"
    - "关闭「抬起亮屏 / 双击亮屏」等手势，减少误触发导致的画面抖动"

  long_term_power:
    risk: "HIGH — 7×24 插电 + 屏幕常亮会同时命中锂电池鼓包与 AMOLED 烧屏两个可靠性陷阱"

    vendor_answer:
      battery_capacity: "4000mAh 典型值 / 3920mAh 额定值，44W 闪充（vivo 官方参数页，已确认）"
      bypass_support: "官方页面无任何旁路供电 / 无电池运行的说明 → 按『不支持』处理"
      note: "不要为了『一次搞定』去赌一个厂商从未承诺的能力"

    chemistry_baseline:
      soc_window: "长期存放的应力最低点约在 SOC 40-60%；无论充电还是放电，两端都是加速老化区"
      voltage_stress: "满电停留是高压应力源；峰值电压每降低约 0.1V，循环寿命大致翻倍"
      heat: >
        热量是比循环次数更狠的因素。45°C 以上显著加速老化，
        满电且长期处于 60°C 环境三个月可损失约 35% 容量。
        本机形态恰恰是"屏幕最亮 + 持续充电"，是自发热最差的组合。
      cycle_depth_reality_check: >
        【避免一个常见误判】浅循环能增加"次数"，但每天的吞吐量是由耗电决定的，改不了。
        按公开数据折算，无论 100% 深度还是 20% 深度，累计可吞吐的总电量基本是同一量级。
        所以本项目的杠杆不在"怎么循环"，而在"长期停留在哪个 SOC 区间"+ "温度"。
        这也是下面 Tier-A 把窗口压在 45-65% 而不是追求更深/更浅循环的原因。

    strategy_decision:
      selected: "Tier A：保留原电池 + 智能插座窄窗口循环"
      decisive_argument: >
        保留电池的最强理由不是寿命，而是**断电容错**：
        电池天然吸收瞬时断电；一旦拆掉电池走旁路供电，任何一次供电闪断都会直接关机，
        而这个系统的定位是"异地无人值守"——关机意味着必须有人到现场去按电源键，
        等于用一个确定的运维灾难去换一个不确定的电池寿命收益。
        只有当该失效模式可被接受时，才值得考虑 Tier B。
      rejected_alternative: >
        曾经设想的"每 24h 断电一次让电池深循环"，方向与化学常识相反，
        v1.4 起废弃：满电停留 + 深度放电恰恰是最伤电池的两件事。

    tier_a:
      name: "默认方案：保留电池 + 慢充 + 智能插座窄窗口"
      key_insight: >
        【关键工程细节】不要用 44W 闪充来做周期补电。
        44W 下补 20% 电量只需几分钟，插座的开关时长窗口窄到无法稳定控制，稍有偏差就是长期满电。
        必须换用 5V/1A（5W）普通充电器，把补电速度压慢到数十分钟量级，
        这样"开多久 = 补多少"才是可控的，控制精度由物理速率保证而不是靠定时器精度。
      steps:
        - "使用 5V/1A 充电器（明确禁用闪充头）"
        - "实机标定一次：屏幕常亮+满载时，从 60% 掉到 40% 需要多少小时 → 得到放电速率"
        - "据放电速率设智能插座补电窗口，目标区间维持 45-65%，宁可偏低不要偏高"
        - "每周复核一次 SOC 区间的实际漂移（相机本身就是最好的 SOC 读数手段：看状态栏电量）"
      smart_plug_requirement: >
        必须选"本地执行定时"的插座，不能选纯云端调度型——
        断外网时云调度会失效，而本地 schedule 仍在跑。
        这一条直接决定该链路是否成为新的单点故障。
      expected_outcome: "把主要失效因子从『满电+热』改为『常温浅循环』，鼓包风险显著下降"

    tier_b:
      name: "备选：拆电池 + 电池模拟器（旁路供电）"
      when_to_use: "仅当确认可以接受『断电即关机且需人工开机』这一失效模式时才考虑"
      method:
        - "拆机取出电池，测量并记录原电池各引脚：B+ / B- / NTC（部分机型还有 BID 数据脚）"
        - "用万用表实测 NTC 引脚对 B- 的阻值 —— 这是必须实测的，不能抄网上数值"
        - "用稳压电源给 B+/B- 供 3.7-4.2V（建议 3.85V 标称），并在 NTC 与 B- 之间接等效电阻"
        - "优先采购成品『电池模拟器 / 激活板』而不是裸电阻飞线"
      why_measure_ntc: >
        实测先例说明 NTC 取值高度机型相关：有案例实测约 2.35kΩ，
        也有论坛经验给出 20-30kΩ。PMIC 判定温度异常会直接拒绝开机或报温度故障，
        照抄他人数值属于高概率返工。
      cited_evidence: "社区/维修业的普遍做法：DC 稳压源或电池模拟器 + NTC 等效电阻 是最常见的可行路径"
      risks:
        - "维修行业来源明确提示：电池模拟器定位是**维修测试**，不是长期驻留方案，长期挂机存在 PMIC 与热风险"
        - "有实践者报告此类改造在运行一段时间后失效，长期可靠性无数据支撑"
        - "拆机即失去保修与防尘防水（若原本有）"
        - "失去断电缓冲（见 strategy_decision.decisive_argument）"
      status: "NOT RECOMMENDED for this project"

    tier_c:
      name: "不采纳：不测 NTC 直接飞线给 B+/B- 供电"
      reason: "PMIC 大概率判定电池缺失/异常而拒绝开机，或报温度故障；且长期安全边界未知"

    screen_burnin:
      cause: "静态 UI 长时间停留是 AMOLED 烧屏主因"
      measures:
        - "长时间无人操作时切到黑屏/息屏（注意：息屏后能否靠 HID 唤醒，需先看 Q4 的验证结论）"
        - "避免常驻高对比度固定元素（如固定在顶部的状态栏图标无法避免，但其本身是系统层级，影响有限）"
        - "降低亮度到仍可辨识的最低档，而不是无脑拉满 —— 亮度与 video 的可辨识度存在权衡，取平衡点"
      note: >
        注意这里与 android_prep.display 中"亮度拉满"存在冲突：
        那是为图像比对争取信噪比，这是为寿命让步。
        实测确定的正确做法是找到"刚好够用"的亮度，而不是默认最大。

    verification_required:
      - "实测一次放电速率并与 5W 充电速率对照，确认窗口设计合理"
      - "连续运行两周后检查机身温度（不应出现明显温升才算合格）"

  verification: "上述每项完成后在 README 打勾并附设置路径截图/录屏，避免换机重装时遗漏"

