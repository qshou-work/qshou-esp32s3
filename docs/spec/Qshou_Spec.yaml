target_device:
  model: "vivo Y71t"
  soc: "MediaTek Dimensity 810"
  android_version: "11"
  rom: "OriginOS 1.0（官方：基于 Android 11.0 开发）"
  model_code: "V2102A"
  bluetooth: "Bluetooth 5.1（支持 LE），解码扩展含 SBC/AAC/aptX/aptX HD/LDAC"
  usb_type: "USB Type-C 2.0 (官方规格明确支持 OTG，含 OTG 反向充电；无 DP Alt Mode，无 HDMI 输出)"
  otg_role: "官方已确认 OTG 支持，USB OTG HID 预留路径的可行性前提成立（兼容性仍待实测）"
  screen_size: "6.44 inch AMOLED"
  screen_aspect_ratio: "20:9"
  screen_refresh_hz: 60
  density_ppi: "~409（1080×2400 / 6.44 英寸算得，与公开参数一致）"
  battery: "4000mAh 典型值 / 3920mAh 额定值，44W 闪充（官方参数）"
  video_output: "NONE — 无 HDMI / 无 DP / 无 USB-C 视频输出"
  key_constraint: "不支持外接显示，硬件 KVM 采集方案不可行，只能摄像头拍屏"

  screen_resolution:
    nominal: "1080 x 2400 (portrait)"
    width: 1080
    height: 2400
    status: "CONFIRMED — 官方规格参数页，非占位值"
    source: "https://www.vivo.com.cn/vivo/param/y71t（屏幕显示：6.44 英寸 / 20:9 / 分辨率 2400×1080 / AMOLED / 60Hz）"
    cross_checked: "GSMArena 与百度百科口径一致：1080×2400、20:9、约 409ppi"
    note: >
      面板物理分辨率已确认，Q2 的「是多少」部分结案。
      剩余待实测的是「应用可用区域」：状态栏（以及若采用三键导航时的导航栏）
      会占用一部分高度。采用手势导航时通常无常驻导航栏，
      可用区约为 1080 × (2400 - 状态栏高度)。
    measurable_by: "adb shell dumpsys window displays → 读 app 矩形；或 wm size 减状态栏高度"
    touch_target_hint: >
      Android 最小可点击目标为 48dp。本机约 409ppi，密度桶大概率是 420 或 440dpi，
      据此 48dp ≈ 126-132 屏幕像素。该数值远大于本方案落点误差预算，
      说明验收指标的裕度是充裕的——真正的限制因素是可辨识度，而非精度。
    todo: "真机到手用 dumpsys 回填 app 可用区域；此项已不再阻塞，可与 M3 标定同批完成"
    consumed_by: "coordinate_mapping.coordinate_systems[SCR].range 与所有比例换算"

# ------------------------------------------------------------
hardware:
  main_board:
    model: "ESP32-S3-N16R8 (teiseky / 兼容板)"
    soc: "ESP32-S3 dual-core Xtensa LX7 @ 240MHz"
    flash: "16MB"
    psram: "8MB Octal SPI (required for camera frame buffer)"
    wireless: "WiFi 4 (802.11 b/g/n, 仅 2.4GHz) + Bluetooth 5 LE"
    coexistence_caveat: >
      WiFi 与 BLE 共用同一根 2.4GHz 天线与射频前端，靠分时复用仲裁。
      持续 MJPEG 推流叠加高频 BLE HID 报告时存在互相抢占的可能，
      表现为图传顿挫或 HID 报告延迟抖动。见 risk_register.R6。
    usb_ports:
      - type: "Type-C (USB-to-UART)"
        purpose: "烧录 / 调试 / 串口日志"
        chip: "CH343P or FTDI"
      - type: "Type-C (Native USB OTG)"
        purpose: "USB HID device (预留，可插 Y71t 当键盘/鼠标)"
        speed: "USB 1.1 Full-Speed 12Mbps"
        gpio: "GPIO19 (USB D-) / GPIO20 (USB D+)"
    gpio_count: 45
    price_range: "¥40-80"
    notes: "双 Type-C 分工明确；N16R8 的 8MB PSRAM 是跑图传的前提"

  camera:
    model: "OV2640"
    interface: "DVP 24Pin (HDF3M-B11)"
    resolution_max: "UXGA 1600x1200"
    recommended_resolution: "VGA 640x480 (balance clarity vs heat vs fps)"
    recommended_fps: "10-15"
    format: "MJPEG"
    focus: "定焦镜头座，出厂多在 30cm~∞ 合焦；本场景必须手动旋出到近距离（见 hardware.optics.focus_procedure）"
    price_range: "¥15-30"
    notes: "OV2640 电压匹配好，发热低于 OV5640；但出厂焦点远不适用本项目的近距离拍摄"

    lens:
      typical_dfov: "66°（常见标配）；同尺寸模块亦有 73° / 90° / 120° 变体"
      aperture: "F/2.0（标配常见标称）"
      focal_length_derived: "DFOV 66° → f ≈ 3.46mm；DFOV 73° → f ≈ 3.04mm（由 1/4 靶面对角 4.50mm 反推）"
      trust_level: >
        【不要相信标称值】不同供应商的同款模块镜头差异极大，且 datasheet 自相矛盾的情况常见
        （例如同一页面同时写 f=2.15mm 与 Fov(H)110°，两者在 1/4 靶面上不可能同时成立）。
        因此设计上不依赖 FOV 标称值，改用 hardware.optics.measure_procedure 现场反推。
      min_focus_distance_stock: >
        标配定焦镜头出厂合焦点通常远于本项目所需距离，直接装上去画面一定是糊的。
        这是比"装不装得下"更容易踩的坑：即使视野勉强够，糊掉等于全盘失败。

    lens_distortion:
      claim: "存在明显径向畸变（桶形），低端塑料镜头尤为突出"
      important_correction: >
        【修正 v1.1-v1.3 的一处技术表述错误】原文档写"由 coordinate_mapping.calibration 吸收"，
        这句话在数学上不成立：单应矩阵 H 只能描述平面到平面的射影变换，
        径向畸变是非线性的非射影畸变，H 无法吸收。
        9 点标定用 H 去拟合带畸变的点，只会把畸变摊平成"平均残差"，
        表现为中心准、边缘偏——而这恰恰落在最需要精度的屏幕四角。
      correct_handling:
        - "首选：OpenCV calibrateCamera 求内参 + 畸变系数，先 undistort 再 fit H（标定一次性离线完成）"
        - "次选：增加标定点密度（≥ 4×4 = 16 点），并用 coordinate_mapping 的留一残差检验；若边缘残差系统性偏大，说明必须上 undistort"
        - "不要为了视野换成 120° 鱼眼标称模块：畸变会把上述成本放大，得不偿失"
      prioritized_because: >
        这与 hardware.optics 的选型结论联动：为满足装下整屏所需的近距离，
        若改用超广角镜头，畸变会成为新的主导误差源。因此选镜头时要在
        "所需距离是否现实" 与 "畸变是否可控" 之间取平衡，66°~90° 是合理区间。

  # --- DVP 接线参考 ---
  pinout:
    source: "参考自 ESP32-S3 常见摄像头方案板的 esp32-camera 配置"
    warning: >
      【必须核对】不同厂商的 N16R8 板卡 GPIO 分配不一致。
      接线前务必拿实际板卡的原理图逐脚比对，不要照抄本表。
      接错 XCLK/PCLK 不会烧毁但绝无输出；接错电源脚会直接损坏摄像头。
    gpio_conflict_note: >
      N16R8 使用 Octal Flash/PSRAM，GPIO 26-37 大概率被存储总线占用，
      不可当作普通 IO 使用。选型和排障时先排除这一点。

    ov2640_to_esp32s3:
      XCLK: 10
      PCLK: 13
      VSYNC: 38
      HREF: 47
      SIOD: 40
      SIOC: 39
      D0: 15
      D1: 17
      D2: 18
      D3: 16
      D4: 14
      D5: 12
      D6: 11
      D7: 48
      PWDN: -1
      RESET: -1

    power:
      VCC: "3.3V（严禁接 5V，OV2640 模块虽带 LDO 但部分板卡直通，务必先确认）"
      GND: "共地，且与 ESP32-S3 单点共地以减少地环路噪声"
    checklist:
      - "杜邦线长度 ≤ 10cm：DVP 并行总线对线长极敏感，过长会导致花屏/丢帧"
      - "排线远离 WiFi 天线与电源线，避免串扰"
      - "若画面出现规律性条纹，优先怀疑线长与共地，而非驱动配置"
    todo: "到货后第一件事用万用表确认摄像头模块的 VCC 电平再上电"

  pin_headers:
    soldered: false
    note: "购买时确认'不焊针'——MVP 阶段不焊也能跑通摄像头+BLE；后续扩展物理按键必须焊排针"

  cooling:
    required: true
    method: "铝制散热片 10x10x5mm 带背胶 ×2 (贴 ESP32-S3 屏蔽罩 + OV2640 背面)"
    cost: "¥2-5"
    notes: "长期跑 WiFi+摄像头+蓝牙 表面温度 60-70°C，加散热片降 8-12°C"
    thermal_throttle: "超过阈值时先降 fps 再降分辨率，不要直接停机（见 reliability.degradation_ladder）"

  power:
    recommended: "5V/2A Type-C 电源适配器 (长期运行)"
    avoid: "电脑 USB 口长期供电 (电流不稳、更热)"
    brownout_risk: >
      摄像头初始化瞬间电流冲击可能触发欠压重启。
      建议在 5V 端并联 100-470µF 电解电容 + 0.1µF 瓷片电容。

  mounting:
    camera_distance: "13-16 cm（默认推荐 15cm，见 hardware.optics；v1.1-v1.3 写的 8cm 已证伪，勿再使用）"
    camera_distance_warning: >
      【已纠错】早期版本凭直觉写"8-12 cm 最佳 8cm"，几何计算表明这是错的：
      标准 66° 镜头在 8cm 处只能装下约 56% 的屏幕长边（大半个屏幕在画面外）。
      正确距离必须由镜头视场反推，见 hardware.optics.distance_table。
    camera_angle: "俯拍 90° 或 斜拍 30-45°"
    anti_reflection: "镜头周围贴黑色海绵遮光筒（近距离拍摄时屏幕很容易倒映镜片与环境光，遮光筒是必需品不是选配）"
    phone_brightness: "Y71t 屏幕亮度拉到最大"
    prefer_top_down: "优先接近 90° 正俯拍，可显著降低透视畸变，放宽对单应矩阵的畸变建模依赖"
    required_rigidity: true
    rigidity_note: >
      【标定前置条件】摄像头与手机必须刚性固定。标定完成后任一部件发生位移，
      都会使 coordinate_mapping 求得的单应矩阵立即失效。
      万向臂/鹅颈管在此处是双刃剑：便于调角度，但易蠕变位移。
      建议调试期用万向臂，标定后用扎带/热熔胶锁死关节，或改用 3D 打印刚性支架。
    camera_orientation: "【建议】把摄像头整机旋转 90°，让画面呈竖向（480 宽 × 640 高）对齐手机长边"
    orientation_reason: >
      屏幕是 20:9（0.45），默认横向画面是 4:3（1.33），长宽比严重错配。
      竖置后同一个 VGA 帧能塞进更多的屏幕内容，等效分辨率提升约 25%。
      详见 coordinate_mapping.frame_coverage 的量化对比。
    field_of_view_caveat: >
      20:9 的屏幕放进 4:3 画面必然大量留白，这是本机型 + OV2640 组合的硬约束。
      满载尺度（刚好装下整屏）下屏幕只占画面中间一条，两侧为无用背景，
      建议在 UI 上裁掉两侧留白、只渲染屏幕区域。
      若需更高采样密度，唯一办法是用 UXGA 单帧（不能流式）。
      见 coordinate_mapping.frame_coverage。
    accessories:
      - "手机支架/万向夹 ¥15-30"
      - "摄像头万向臂/鹅颈管 ¥10-20"
      - "黑色海绵条/遮光筒 DIY ¥5"
      - "杜邦线若干 ¥5"
      - "扎带/热熔胶/刚性支架 (锁定关节用) ¥5-20"

  # --- 光学几何：Q7 结案产出，决定 mounting.camera_distance ---
  optics:
    purpose: >
      回答「摄像头离屏幕多远才装得下整屏」。这是纯几何问题，可离线算清，
      不需要真机就能定死范围；反过来，把它留给现场试错会直接浪费调焦与标定的时间。

    target_geometry:
      screen_active_area_mm: "67.13 × 149.17mm"
      screen_source: "由 6.44 英寸对角 + 20:9 反推：长边 = 163.58 × 20/√(20²+9²)"
      screen_body_estimate_mm: "约 75 × 157mm（显示区外加约 4mm 边框，用于判断机身是否会遮挡）"
      sensor_active_area_mm: "3.5904 × 2.7104mm"
      sensor_source: "OV2640 有效阵列 1632×1232 @ 2.2µm，对角 4.4986mm，即俗称的 1/4 英寸"
      key_assumption: >
        视场由镜头与靶面决定，与输出分辨率无关（VGA 是 UXGA 的缩放/裁剪读出，不改视场）。
        因此下表对 VGA / SVGA / UXGA 一律成立，这也是为什么不必为每种分辨率重算一遍。
      notable_check: >
        顺便验证了早期版本里的一个直觉：「8cm」这个数字来自"离得近看得清"的想当然，
        但它只考虑了像素密度，完全没有考虑角覆盖——而角覆盖才是先决条件。

    distance_table:
      - condition: "DFOV 60°（f≈3.90mm，偏长焦的少见变体）"
        dfov_deg: 60
        hfov_deg: 49.5
        vfov_deg: 38.4
        min_distance_mm: 162
      - condition: "DFOV 66°（最常见的标配镜头）"
        dfov_deg: 66
        hfov_deg: 54.8
        vfov_deg: 42.7
        min_distance_mm: 144
      - condition: "DFOV 73°（部分模块）"
        dfov_deg: 73
        hfov_deg: 61.1
        vfov_deg: 48.1
        min_distance_mm: 126
      - condition: "DFOV 78°"
        dfov_deg: 78
        hfov_deg: 65.8
        vfov_deg: 52.0
        min_distance_mm: 115
      - condition: "DFOV 90°（广角变体）"
        dfov_deg: 90
        hfov_deg: 77.2
        vfov_deg: 62.1
        min_distance_mm: 94
      - condition: "DFOV 120°（鱼眼变体，不推荐）"
        dfov_deg: 120
        hfov_deg: 108.2
        vfov_deg: 92.4
        min_distance_mm: 54
    distance_table_note: >
      表中距离是「摄像头已旋转 90° 竖置、且刚好完整覆盖屏幕显示区」的最小距离。
      长边（149.17mm）是约束边，短边（67.13mm）在任何情况下都不是瓶颈——
      这与 coordinate_mapping.frame_coverage 的结论一致：4:3 画面装 20:9，宽度永远富余。
      实用取值请在最小值上加 5-10% 余量（留给手机边框、装机公差，以及 UI 可裁切的一点空白）。

    coverage_at_distance:
      - condition: "DFOV 66°，d=8cm（早期版本的推荐值）"
        long_side_covered_pct: 55.6
        verdict: "装不下：近半个屏幕在画面外。这是必须纠正的错误。"
      - condition: "DFOV 66°，d=12cm（早期版本的 fallback 值）"
        long_side_covered_pct: 83.4
        verdict: "仍装不下，缺约 17%。早期把 12cm 当 fallback，实际上也不够。"
      - condition: "DFOV 66°，d=14cm"
        long_side_covered_pct: 97.3
        verdict: "临界，勉强"
      - condition: "DFOV 66°，d=15-16cm"
        long_side_covered_pct: "104-111"
        verdict: "推荐工作点：整屏入画且保留 4-11% 边框余量"
      - condition: "DFOV 73°，d=13cm"
        long_side_covered_pct: 103
        verdict: "推荐工作点"
      - condition: "DFOV 90°，d=10-11cm"
        long_side_covered_pct: "107-118"
        verdict: "可用，但要接受更重的径向畸变（见 hardware.camera.lens_distortion）"

    recommended_working_point:
      default: "未知镜头视场时：先按 15cm 试，再按 measure_procedure 反推校准"
      if_66_deg: "15cm"
      if_73_deg: "13cm"
      if_90_deg: "10.5cm"
      rule: >
        不要一味拉远。屏幕在画面里占得越大，每个摄像头像素承载的屏幕像素越少，
        标定与辨识才越好——所以「刚好装满 + 一点余量」才是最优解，不是「越远越安全」。

    measure_procedure:
      reason: "供应商给的 FOV 标称值不可信，必须用屏幕本身当标尺现场反推"
      steps:
        - "把摄像头刚性固定在某个距离 d（先用 150mm），正俯拍"
        - "拍一帧，数出屏幕长边（149.17mm）在画面竖直方向占了 p 个像素；画面竖直总像素记为 M（VGA 竖置 M=640）"
        - "画面在该方向的可见总宽度 L = 149.17 × M / p（单位 mm）"
        - "实际竖直视场 FOV_v = 2 × arctan( L / (2d) )，由此得到 tan(FOV_v/2) = L/(2d)"
        - "把 FOV_v 代回：完整装下所需最小距离 d_min = (149.17/2) / tan(FOV_v/2)"
        - "把 d 调整到 d_min × 1.05 ~ 1.10，锁死机构后再标定"
      cross_check: "若算出的 d_min 与 distance_table 里 66°/73° 那两行差得很远，先怀疑自己选错了模块，而不是怀疑公式"

    focus_procedure:
      warning: "出厂合焦点远于我们的工作距离，不调焦则画面必糊；这是比视野更易踩的坑"
      steps:
        - "先按 measure_procedure 定死距离 d，再调焦（顺序不能反，否则白调）"
        - "镜头与座之间有螺纹，出厂多点了胶；用少量酒精浸润或热风枪低温软化后再旋"
        - "逆时针微量旋转（< 1/4 圈）使焦点前移；边旋边看 VGA 实时画质"
        - "判定标准：不要凭肉眼觉得凑合，要看 Pointer location 的十字线锐利度，或直接看标定图的最小线宽"
        - "调好后用少量 UV 胶 / 指甲油把螺纹锁死，防止后续震动使焦点缓慢漂移"
      acceptance: "在标定点最密的区域仍能分辨 1-2 像素宽的黑白边界"

    depth_of_field:
      model: "Hyperfocal 近似，CoC 取 2 像素 = 4.4µm，光圈 F/2.0"
      examples:
        - condition: "DFOV 66°（f=3.46mm），合焦 140mm"
          near_mm: 127
          far_mm: 156
        - condition: "DFOV 66°（f=3.46mm），合焦 160mm"
          near_mm: 143
          far_mm: 181
        - condition: "DFOV 73°（f=3.04mm），合焦 140mm"
          near_mm: 124
          far_mm: 162
      conclusion: >
        近距离微距下的景深比直觉浅得多，可接受范围只有 ±15-25mm。
        这直接支撑 hardware.mounting.required_rigidity：约束的不只是朝向，
        轴向 ±2cm 的位移就足以让画面掉出合焦区。机构必须同时约束「朝向」和「距离」。
      caveat: "该模型假设衍射与塑料镜片像差可忽略，实际模块的宽容度通常略好于此估算；只用于判定风险量级，别当精确值"

    consequences:
      - "相机必须离屏 13-16cm 而非 8cm —— 这一改动会影响支架选型（普通手机夹的臂长要够）"
      - "距离拉远后更容易倒映环境光，遮光筒从「可选」变成「必选」"
      - "景深很浅 → 机构的轴向刚度要求和角刚度同样重要"
      - "屏幕的物理长度 149mm 意味着整机占地至少约 16×8cm，部署位置要提前预留"

# ------------------------------------------------------------
# 采购清单（BOM）—— 汇总自 hardware，用于一次性下单
# ------------------------------------------------------------
bom:
  currency: "CNY"
  principle: "先最小集跑通（必选），确认方案成立后再补可选件，避免一次性买齐后返工"
  revision: >
    v1.4 重写。此前清单是在「8cm 距离 + 无长期供电设计 + 未考虑远程接入」的前提下写的，
    三项前提都已被 v1.3-v1.4 的结论推翻，因此补进了四组此前完全缺失的物料：
    Y71t 慢充组合（Q5 Tier-A）、本地定时智能插座（Q5/R15）、
    Tailscale 常开节点（Q6）、以及支持 13-16cm 工作距的刚性悬臂与调焦耗材（Q7/R12）。
    旧口径的「总价 <¥200」已作废，见 total_estimate。

  legend:
    ownership: "owned = 假定你已有；buy_now = 建议本次立刻下单；decide_first = 需你先拍板；later = M2 之后再买"
    price: "¥ 为单件估算含常见区间的中位偏保守值，未含运费"

  # --- 假定已有，不用买；但其中几项会直接影响下面的选型 ---
  owned:
    - item: "vivo Y71t 本体（含原装 Type-C 线）"
      note: "原装线仅用于初期调试；长期供电会被下面的 5V/1A 头替代"
    - item: "Win10 控制端电脑"
    - item: "家用 WiFi 路由器"
      note: "它可能就是 subnet router 的答案，见 decide_first"
    - item: "万用表"
      why: "上电前确认摄像头 VCC 电平、以及若走 Tier-B 时测电池 NTC 阻值"
    - item: "酒精 / 热风枪 / 尖嘴钳 / 剪刀 / 指甲油"
      why: "软化镜头螺纹的固定胶并旋转调焦；没有热风枪用电吹风凑合也可"

  # --- 核心电子件：跑通 M0-M1 的最小闭集 ---
  electronics_core:
    - item: "ESP32-S3-N16R8 开发板（双 Type-C，不焊排针）"
      qty: 1
      unit_price: "¥40-80"
      why: "MVP 核心；8MB PSRAM 是图传前提"
      critical: "必须是 N16R8。N8R2 / N16R2 等 PSRAM 更小的版本跑不动 MJPEG (frame buffer)"
    - item: "OV2640 摄像头模块 24Pin —— 优先买「可调焦/手拧镜头」版本"
      qty: 2
      unit_price: "¥20-35"
      why: >
        买 2 颗：一颗用，一颗用于排除摄像头本体故障（OV2640 的坏件率不可忽视）。
        强烈建议买带手拧调焦环的版本，而不是点胶定焦的标配款 ——
        标配款出厂合焦点远于本项目所需的 13-16cm，必须破坏点胶才能旋转，
        这是 R12 的来源；多花十几块可以直接消除这个风险。
      critical: "确认 VCC 为 3.3V 版本；部分板卡 VCC 直通，接到 5V 必烧"
    - item: "Type-C 数据线（能传数据的，不是纯充电线）"
      qty: 2
      unit_price: "¥8-15"
      why: "开发板有两个 Type-C：一个 USB-to-UART 用于烧录与串口日志，一个是 Native USB"
      critical: "纯充电线不传数据，会导致『插上没反应』这种最浪费时间的故障"
    - item: "杜邦线（母对母，≤10cm）"
      qty: "20 根起"
      unit_price: "¥5"
      why: "DVP 并行总线对线长极敏感，超长会直接花屏"
    - item: "铝制散热片 10x10x5mm 带背胶"
      qty: 2
      unit_price: "¥2-5"
      why: "长期满载 WiFi+摄像头+蓝牙，表面 60-70°C"
    - item: "5V/2A Type-C 电源适配器（给 ESP32）"
      qty: 1
      unit_price: "¥15-25"
      why: "避免电脑 USB 口长期供电"
    - item: "电解电容 470µF + 瓷片电容 0.1µF"
      qty: "若干"
      unit_price: "¥3"
      why: "抑制摄像头初始化冲击电流导致的欠压重启"

  # --- 机械与光学：Q7 把工作距离从 8cm 改成 13-16cm 后，这组成了关键路径 ---
  mechanics_optics:
    - item: "铝合金悬臂/魔术臂支架（横臂 ≥ 20cm，能负重且可锁死）"
      qty: 1
      unit_price: "¥25-50"
      why: >
        这是 Q7 的直接产出：工作距离变成 13-16cm，且要覆盖 149mm 的屏幕长度，
        普通夹子式手机支架的臂长和刚度都不够。
        关键不是买贵的，而是**能在拧紧后不再蠕变**（见 R3）。
      critical: "要同时能约束摄像头的位置与俯角；鹅颈管单独用不推荐，太容易缓慢回弹"
    - item: "手机固定座 / 万向夹（固定 Y71t）"
      qty: 1
      unit_price: "¥15-30"
      why: "Y71t 与摄像头必须刚性固定，任何相对位移都会让单应矩阵失效"
    - item: "黑色 EVA 泡棉条 / 哑光黑卡纸（自制遮光筒）"
      qty: 1
      unit_price: "¥5-10"
      why: "近距离拍屏极易倒映镜片与环境光。这在 8cm 时代是可选，15cm 时代是必需"
    - item: "扎带 + 热熔胶枪（若手边没有）"
      qty: 1
      unit_price: "¥15-25"
      why: "标定完成后把所有关节锁死，包括轴向（景深只有 ±15-25mm，不能用会回弹的临时固定）"
    - item: "UV 胶 或 透明指甲油"
      qty: 1
      unit_price: "¥5-10"
      why: "调焦完成后锁死镜头螺纹，防止震动使焦点缓慢漂移（hardware.optics.focus_procedure 步骤之一）"
    - item: "L 型铝合金角件 / 3D 打印件（可选，终态加固用）"
      qty: "若干"
      unit_price: "¥10-20"
      why: "万向臂只能用于调试期；终态建议换成刚性结构"

  # --- Y71t 长期供电组：Q5 Tier-A 的产物，此前清单完全没有 ---
  powered_end_devices:
    - item: "5V/1A 普通充电头 + Type-C 线（给 Y71t，**明确不支持快充协议**）"
      qty: 1
      unit_price: "¥15-25"
      why: >
        这是 Tier-A 最容易买错的一件。绝不能用 Y71t 原装的 44W 闪充头：
        闪充下补 20% 电量只要几分钟，智能插座的开关窗口窄到无法稳定控制，
        稍有偏差就变成长期满电浮充 —— 恰好是最伤电池的状态。
        用 5W 慢充把补电拉到数十分钟量级，"开多久 = 补多少"才由物理速率保证。
      critical: "下单前确认商品明确标注 5V/1A 且不兼容 QC/PD/VOOC"
    - item: "本地执行定时的智能插座（或纯机械式时控开关）"
      qty: 1
      unit_price: "¥25-40"
      why: "实现 Tier-A 的窄 SOC 窗口策略（目标 45-65%）"
      critical: >
        必须选**本地执行定时**的型号。纯云端调度型在断外网后不再执行 schedule，
        Y71t 会一路放电到关机而你不在现场 —— 这就是 R15 的内容。
        如果拿不准，直接买机械式定时插座更保守。

  # --- 需要先拍板才能下单 ---
  decide_first:
    - item: "Tailscale subnet router 由谁来当"
      why: "Q6 的唯一解；ESP32 自己跑不了客户端，必须有一台同网段的常开节点"
      options:
        - option: "现有家用路由器刷 OpenWrt 装 Tailscale"
          cost: "¥0"
          verdict: "最优，但要先查型号是否在 OpenWrt 支持列表且有足够 Flash"
        - option: "换一台原生支持 Tailscale 的路由器（如 GL.iNet 系列）"
          cost: "¥150-300"
          verdict: "次优，一次性解决，但属于不必要的大额支出"
        - option: "树莓派 Zero 2 W / 3B"
          cost: "¥80-200"
          verdict: "稳妥但要额外买电源与 SD 卡，且又多一个要维护的设备"
        - option: "复用已有的 NAS / 旧 x86 小主机"
          cost: "¥0"
          verdict: "如果本来就在跑 Linux，这是性价比最高的答案"
      action_required: "你先确认上面哪一条成立，才能下单，或确认这笔支出为 ¥0"
      caution: "Android 手机/平板不能当 subnet router，其 Tailscale 客户端不具备路由通告能力"

  # --- M2 之后再评估，不要现在买 ---
  later:
    - item: "排针 / 排母"
      why: "MVP 不需要；只有做 v2 的物理按键扩展（继电器/FingerBot）才需要焊接"
    - item: "继电器模块 / 物理按键机器人"
      why: "extensibility 已预留，用于解决 R10（手机假死时无法恢复）"
    - item: "microSD 卡"
      why: "如需在 ESP32 侧本地留存标定与证据数据；MVP 不需要"
    - item: "可调直流稳压电源（拆电池后充当电池模拟器）"
      why: "仅当放弃 Tier-A、改走 Tier-B（拆电池旁路供电）时才需要，本项目不推荐"

  purchase_spec_checklist:
    note: "下单前逐条核对 —— 错买一件往往比多花几十块贵得多"
    items:
      - "开发板型号必须是 N16R8，确认 PSRAM = 8MB（不是 Flash 16MB 就够）"
      - "开发板注明『不焊排针』"
      - "摄像头 VCC = 3.3V；最好买可调焦版本而非点胶定焦"
      - "Type-C 线是数据线，不是纯充电线"
      - "给 Y71t 的充电头必须是不支持快充协议的 5V/1A"
      - "智能插座必须本地执行定时"
      - "悬臂支架横臂 ≥ 20cm 且能可靠锁死"

  total_estimate:
    electronics_core: "¥110-170"
    mechanics_optics: "¥75-160"
    powered_end_devices: "¥40-70"
    subnet_router: "¥0-300（取决于 decide_first 的选择）"
    total: "¥225-700，中位约 ¥300"
    supersedes: >
      作废 v1.1-v1.3 的「<¥200」口径。差额主要来自三块：
      第二颗摄像头（排障用，¥20-35）、Tier-A 供电组（¥40-70）、
      以及能覆盖 15cm 工作距的刚性悬臂（¥25-50）。
      电子核心件本身仍在 ¥120 上下，此前的估算是低估了机械与耗材，不是低估了芯片。

  note: "本表与 hardware.mounting.accessories 互为补充；凡有新购务必回填本章节"

# ------------------------------------------------------------
video:
  source: "OV2640 摄像头拍 Y71t 屏幕 (非 HDMI/DP)"
  pipeline: "OV2640 → ESP32-S3 DVP → PSRAM frame buffer → MJPEG encode → WiFi → Win10"
  protocol: "WebSocket (ws://esp32/api/v1/stream) 或 HTTP multipart (http://esp32/api/v1/camera)"
  encoding: "MJPEG (JPEG per frame, no H.264)"
  resolution: "VGA 640x480 (推荐) / SVGA 800x600 (最大)"
  fps: "10-15 (延迟不敏感)"
  jpeg_quality: "10-14 (esp32-camera 参数，数值越小压缩率越高)"
  recording: false
  ocr: false
  ai_vision: false
  notes: "ESP32-S3 无 H.264 硬编，MJPEG 够用；不录不 OCR 不 VLM"

  bandwidth:
    per_frame_kb: "10-25 KB (VGA 中低画质)"
    at_15fps: "约 150-375 KB/s，即 1.2-3.0 Mbps"
    caveat: >
      这是 WiFi 侧的持续负载。若 Tailscale 未能 P2P 打洞而走 DER 中继，
      中继链路质量会成为瓶颈，表现为顿挫而非降帧。
    optimization_levers: "降 jpeg_quality → 降 fps → 降分辨率，按此顺序调整"

# ------------------------------------------------------------
# 坐标映射 —— MVP 必做，非可选优化项
# ------------------------------------------------------------
coordinate_mapping:
  required: true
  criticality: "BLOCKING — 不做此步则『能看到画面但点不准』，整个方案不可用"
  rationale: >
    一次点击要穿过三次坐标变换。用户在 Win10 画面上看到的是摄像头成像像素，
    而 BLE 报告只能承载 HID 逻辑坐标，二者之间必须经过屏幕物理像素做桥接。
    摄像头俯拍必然存在透视畸变与径向畸变，CAP 与 SCR 之间是射影变换而非线性关系，
    直接用画面像素线性缩放到 HID 会导致中心尚可、边缘严重偏移。

  coordinate_systems:
    - id: "CAP"
      name: "摄像头画面坐标系 (Camera Pixel)"
      unit: "pixel"
      origin: "MJPEG 帧左上角 (0,0)"
      range: "VGA 模式下 x∈[0,639], y∈[0,479]"
      source: "Win10 canvas 上鼠标点击位置换算得到"
      observable: true
      note: "唯一用户可直接观测的坐标系，但它是畸变后的投影结果"

    - id: "SCR"
      name: "Y71t 屏幕物理坐标系 (Screen Pixel)"
      unit: "px"
      origin: "屏幕左上角 (0,0)"
      range: "以 target_device.screen_resolution 实测值为准，如 x∈[0,1079], y∈[0,2399]"
      source: "中间桥梁坐标，实际不可直接观测，只能由标定反推"
      observable: false
      note: "所有 UI 层的决策都基于这一层讨论，是换算的枢纽"

    - id: "HID"
      name: "BLE HID 逻辑坐标系 (HID Logical)"
      unit: "logical unit"
      origin: "左上角 (0,0)"
      range: "0-10000（整数域，X/Y 各 16 bit）— 已确认"
      source: "BLE 绝对坐标触控报告的实际载荷"
      observable: false
      transport: "HID over GATT，Report ID 0x01，单帧 5 字节"
      report_layout: "[state:1B][X_MSB][X_LSB][Y_MSB][Y_LSB]，state 的 bit0=Tip Switch，bit1=In Range"
      state_encoding: "按下 = 0x03（Tip Switch + In Range 同时置位）；抬起 = 0x00"
      note: >
        上界 10000 由所选库的 Report Descriptor 声明，Android 将其线性映射到整屏。
        不要自行编造其它上界；若换库必须重新读取 descriptor 确认。
        该值与屏幕分辨率无耦合，因此换机型或改可用区域时无需改描述符。

  # --- 取景分析：20:9 屏幕 vs 4:3 传感器 ---
  frame_coverage:
    purpose: "量化「整屏能否装下、装下后还剩多少有效像素」，这直接决定画面的辨识下限"
    premise: "1080×2400（20:9）的屏幕 + OV2640 的 4:3 画幅，长宽比错配，装下整屏必然留白"

    table:
      - mode: "VGA 横向 640×480（默认）"
        scale: "受限边为画面高，s = 480/2400 ≈ 0.20"
        screen_footprint: "约 216×480"
        waste: "画面宽度浪费约 66%"
        scr_per_cap_px: 5.0
      - mode: "VGA 竖向 480×640（摄像头旋转 90°）"
        scale: "s = 640/2400 ≈ 0.267"
        screen_footprint: "约 288×640"
        waste: "画面宽度浪费约 40%"
        scr_per_cap_px: 3.75
      - mode: "SVGA 竖向 600×800"
        scale: "s = 800/2400 ≈ 0.333"
        screen_footprint: "约 360×800"
        waste: "约 40%"
        scr_per_cap_px: 3.0
      - mode: "UXGA 竖向 1200×1600（仅单帧，不可流式）"
        scale: "s = 1600/2400 ≈ 0.667"
        screen_footprint: "约 720×1600"
        waste: "约 40%"
        scr_per_cap_px: 1.5

    distance_linkage: >
      本表隐含前提是「屏幕长边恰好铺满画面」，而这个前提不是免费的：
      它由 hardware.optics 的几何关系决定，具体由相机到屏幕的距离实现。
      距离过近 → 屏幕装不进画面（边缘无标定点）；
      距离过远 → 屏幕在画面里只占一小块，scr_per_cap 恶化。
      因此挑距离的正确目标是「刚好装满 + 5-10% 余量」，而不是"越近越好"或"越远越保险"。
      参见 hardware.optics.distance_table 与 recommended_working_point。

    conclusion:
      - "默认横向 VGA 是最差选择：屏幕只占画面的三分之一宽，强烈建议物理旋转摄像头 90°"
      - "流式只看 VGA；校准与关键取点用 UXGA 单帧，能把单点取样精度提升约 2.5 倍"
      - "即使在最好的 VGA 流式方案下，1 个摄像头像素 ≈ 3.75 个屏幕像素，
         所以「辨识小字」从来不是本方案的能力范围——重申 non_goals 已排除 OCR/AI 视觉"
      - "留白区域在 UI 上应裁掉，既省带宽也减少误点"

    impact_on_acceptance: >
      按人眼点击抖动 ±2 个摄像头像素估算，竖置 VGA 下降解到屏幕坐标是 ±7.5 px。
      对照 48dp 最小触控目标（本机型约 126-132 px），该误差仅占目标尺寸的 6%，
      因此「点得准」在工程上是稳的；但 UI 里不应把容错建立在精细化描点上。

  transform_chain:
    step_1_CAP_to_SCR: "单应矩阵反变换 SCR_pt = H^-1 · CAP_pt（射影变换，一并吸收透视与径向畸变）"
    step_2_SCR_to_HID: "线性缩放 HID_x = round(SCR_x / (SCR_W-1) * 10000)，y 同理（HID_MAX 已确认为 10000）"
    forward_summary: "CAP --[H^-1 单应]--> SCR --[线性缩放]--> HID --[BLE report]--> Y71t"
    reverse_summary: "SCR --[摄像头成像]--> CAP，由硬件安装几何决定，锁定后视为常量"
    forbidden_shortcut: >
      禁止 CAP → HID 直接线性缩放。这是最容易犯的工程错误，
      倾斜 30-45° 安装时边缘误差可达数十像素以上。

  calibration:
    enabled: true
    method: "单应性矩阵 Homography H (3x3)，OpenCV findHomography 或 numpy 最小二乘求解"
    min_points: 4
    recommended_points: 9
    point_layout: "3x3 网格均匀分布于屏幕可见区，内缩约 10% 避开四角极端畸变区"
    flows:
      - "Y71t 全屏显示高对比 3x3 网格标定图（务必避开纯黑——AMOLED 黑像素不发光，取不到特征）"
      - "关闭自动息屏，屏幕亮度拉满"
      - "Win10 拉取单帧（建议临时切 UXGA 提高取点精度，采集完成后再切回 VGA 运行）"
      - "UI 进入标定模式，依次点击 9 个已知 SCR 坐标对应的画面位置，记录 CAP 坐标"
      - "用 9 组 (CAP_i, SCR_i) 对应点求解 H（点数 ≥5 时做最小二乘拟合）"
      - "leave-one-out 残差校验：逐点剔除后重算，预测残差 > 3 px 判定标定失败并重采"
      - "H 矩阵持久化：写入 ESP32 NVS 或 Win10 本地 JSON（按 device_id 分 profile）"
    persistence: "必须跨重启保留，不得每次上电重新标定"

    frame_source:
      decision: "标定点采集统一切到 UXGA 单帧；出流仍用 VGA"
      reason: "竖置 VGA 下 1 CAP px ≈ 3.75 SCR px，人工取点抖动会被放大近 4 倍；
              UXGA 下该比例降到 1.5，且大图更容易对准网格交叉点"
      note: "注意 H 的入参坐标系必须统一：若按 UXGA 取点，运行时需按分辨率比对 CAP 坐标做预缩放"

    residual_offset:
      enabled: true
      reason: >
        单应矩阵能吸收几何畸变，但吸收不了「系统性偏移」——
        例如 Android 对 HID 坐标映射的取整方式、屏幕可用区域与面板分辨率不一致
        （状态栏占用导致的整体下移）。这类偏差表现为全画面整体偏移而非局部失真。
      mechanics: "在 H 之后追加一个常量平移 (dx, dy)，由 9 点残差的均值估计"
      library_support: "Autfy/ESP32-BLE-HID 的 setCalibrationOffset(offsetX, offsetY) 即为此设计"
      order: "必须先做 H 再做 offset，且二者要迭代一次：offset 会改变残差分布"
    resolution_policy: >
      标定帧与运行帧分辨率不同时，须按分辨率比例对 CAP 坐标做预缩放，
      保证 H 矩阵入参坐标系一致。建议统一在 VGA 域标定以减少换算环节。
    retrigger:
      - "摄像头或手机任一位移 / 被触碰"
      - "观察到点击偏差肉眼可见"
      - "重新调焦或重新安装遮光筒"
      - "更换分辨率配置"
    api: "POST /api/v1/calibrate/point 采集单点，POST /api/v1/calibrate/commit 提交并求解"

  error_budget:
    source_breakdown:
      - "支架位移/蠕变 → H 失效（最高频，误差无上界）"
      - "标定点人工取点误差 ±1-2 CAP px → 放大到 SCR 约 ±3-5 px"
      - "JPEG 块状伪影导致边缘定位抖动 1-2 px"
      - "标定点过少或无冗余 → 最小二乘失去残差约束，畸变建模不足"
      - "8cm 距离下 OV2640 视野可能裁切屏幕边框 → 边缘区域无标定点覆盖"
    mitigation:
      - "锁定关节，标定后禁止挪动"
      - "9 点取点 + 残差门槛双重约束"
      - "关键操作避开屏幕最外 5% 区域"
      - "每个关键点击后拉帧做位置回读（见 automation.coordinate_assertions）"

  acceptance:
    center: "屏幕中心 60% 区域内点击落点误差 < 5 屏幕物理像素"
    edge: "四角区域误差 < 15 屏幕物理像素"
    repeatability: "同一目标连续点击 10 次，落点标准差 < 3 px"
    verification: "开启开发者选项「指针位置」，肉眼读数与指令期望值比对"
    sanity_check: >
      本机型最小触控目标约 126-132 px（48dp），上述误差预算仅占其个位数量级的百分点，
      指标本身是充裕的。若实测不达标，先怀疑 H 矩阵失效或存在系统性 offset，
      而不是要求更精细的点击——像素采样密度（3.75 SCR px / CAP px）才是物理上限。
    dont_confuse: >
      注意「点击精度」与「视觉可辨识度」是两个不同问题：
      前者受标定质量影响，后者受 frame_coverage 的采样密度限制，后者无法通过工程优化解决。

  runtime_placement:
    decision: "MVP 阶段换算放在 Win10 客户端"
    reason: "Win10 侧有 numpy/OpenCV，调试可视化方便；ESP32 只接收最终 HID 指令"
    esp32_api: "POST /api/v1/tap 接收已换算的 HID 坐标"
    future_option: "多设备量产后可把 H 写入 NVS，改由 ESP32 端换算，减少一轮往返"

# ------------------------------------------------------------
input:
  primary: "BLE HID (ESP32 广播为蓝牙键盘+鼠标+Consumer Control)"
  secondary: "USB OTG HID (预留，需验证 Y71t OTG 兼容性)"
  tertiary: "物理按键/继电器 (预留，本期不做)"

  ble_hid:
    keyboard: true
    mouse_relative: true
    mouse_absolute: true
    consumer_control: true

    # --- 相对 / 绝对坐标决策（编码前必须收口）---
    coordinate_mode:
      status: "RESOLVED — 采用 absolute（Digitizer 触摸屏方案）；剩 ROM 兼容性实测，不再阻塞选型"
      decision_date: "2026-09-28"
      summary: >
        relative 模式发送位移增量 (dx,dy)，需要「归零」且误差会累积；
        absolute 模式直接发送目标点绝对坐标，一步到位，零累积漂移。
      resolved_answer: >
        【Q1 结案】Android 接受第三方 BLE 绝对坐标，但关键在前置条件：
        必须走 Digitizer / Touch Screen 描述符（Usage Page 0x0D + Usage 0x04），
        而不是「传统鼠标描述符 + Absolute 标志位」。后者在 Android 上不可靠，
        这正是社区里「绝对鼠标在安卓点不动」的根因。
        两个独立证据相向印证：
        (1) sobrinho/ESP32-BLE-Abs-Mouse 明确使用 digitizer 描述符且标注兼容 Android，
            其实现细节显示 5 字节报告、Report ID 0x01、逻辑范围 0-10000、state=0x03 为按下；
        (2) Autfy/ESP32-BLE-HID 文档直接写明「Android 等设备会将 0~10000 逻辑坐标映射到屏幕」，
            并提供 setScreenSize(1080, 2400) 与像素坐标自动换算接口。
      evidence_note: >
        反面旁证：开源库 kshoji/BLE-HID-Peripheral-for-Android 的兼容矩阵里，
        「绝对鼠标」只在 macOS 上确认可用，Android 作为中心设备一列没有通过验证。
        这与上述结论不矛盾——它验证的是「绝对鼠标」路径，而非「触摸屏」路径。
      consequence_for_mvp: >
        坐标模式已确定，implementation_order.step_4 的门禁 A 降级为一小时级的
        兼容性冒烟测试，不再是选型决策。选型、库依赖、协议格式可以提前固化。
      residual_risk: "OriginOS 1.0 / Android 11 定制 ROM 仍可能在个别机型上忽略该描述符，故 M2 需真机冒烟"

      relative_mode:
        mechanism: "BLE Mouse 相对坐标，报告 (dx, dy) 位移增量 + 按键状态"
        tap_procedure:
          - "先把虚拟指针移到已知原点（发 HOME / BACK，或连续大额负位移撞边界饱和）"
          - "分多帧发送位移逼近目标"
          - "到位后发点击事件"
        pros:
          - "兼容性最好，Android 普遍支持，ESP32-BLE-Mouse / ESP32-BLE-Combo 均可实现"
          - "不依赖特殊的 HID Report Descriptor"
        cons:
          - "无法读回指针真实位置，误差累积漂移且不可自愈"
          - "tap 前需多步 move，实际延迟 = 100-300ms × 步数，体感明显"
          - "swipe 需高频插帧，帧间抖动会被安卓指针速度曲线放大"
        drift_mitigation:
          - "每次 tap 前先 HOME/BACK 归位（最有效，代价是破坏当前上下文）"
          - "利用「指针到边界后位移饱和」特性做边界复位"
          - "视觉闭环：点完拉帧比对是否命中，未命中做一次小步修正（限 2 次）"
        requires_pointer_origin_state: true

      absolute_mode:
        selected: true
        mechanism: "BLE Touch / 绝对鼠标，直接报告目标点在 HID 逻辑域中的绝对位置"
        correct_descriptor_spec:
          usage_page: "Digitizer (0x0D)"
          usage: "Touch Screen (0x04)"
          collections: "Application → Stylus (0x20) Physical → Pointer"
          touch_flags: "Tip Switch (0x42) 1 bit + In Range (0x32) 1 bit + 6 bit padding"
          axes: "X (0x30) / Y (0x31)，各 16 bit，Logical + Physical Max = 10000"
          report_id: "0x01"
          report_length: "5 字节"
          state_machine: "按下 = 0x03；抬起 = 0x00"
          warning: >
            不要把上述写法理解成「鼠标描述符 + Absolute 标志」。
            二者在 Android 上的结局完全不同——前者被 InputReader 认作触摸屏，
            后者常常被静默丢弃。这是本方案最容易踩空的一步。
        tap_procedure:
          - "SCR → HID 线性映射（见 coordinate_mapping.transform_chain.step_2）"
          - "发送 state=0x03 的按下报告，坐标指向目标点"
          - "间隔数毫秒后发送 state=0x00 抬起（Tip Switch 与 In Range 同时清零）"
        swipe_procedure: "按下后按路径插值发送中间点（set_steps 控制），最后抬起；Contact ID 恒定"
        library: "Autfy/ESP32-BLE-HID（键盘 + 绝对触控复合，明确支持 WiFi 共存）"
        library_api_notes:
          - "setScreenSize(1080, 2400) 后可直接 sendAbsolutePixel() 传像素坐标，无需自行换算"
          - "setLogicalRange(maxX, maxY) 默认 10000x10000，与 descriptor 一致，通常无需改"
          - "setCalibrationOffset() 用于修残余系统性偏移，对应 coordinate_mapping.calibration.residual_offset"
          - "swipeLinear / swipeBezier 已内置插值，不必自己写"
        pros:
          - "一步到位，无累积漂移，无需归零，延迟最低"
          - "swipe 可按路径插值，轨迹可控且平滑"
          - "与坐标标定天然契合：CAP→SCR→HID 全链路确定"
          - "注入的是真实触摸事件，行为等同于手指操作，兼容性优于模拟鼠标"
        cons:
          - "依赖单一维护者的库（活跃度已确认至 2026-02，但仍是单作者项目）"
          - "触摸屏模式下没有可见光标，「指针位置」开发者选项是唯一视觉反馈来源"
          - "OriginOS 1.0 / Android 11 个别 ROM 仍可能忽略该描述符"
        validation_required: "真机冒烟：一次 tap + 一次 swipe，看是否产生触控反馈"
        requires_pointer_origin_state: false

      decision_rule: >
        【已于 2026-09-28 收口】采用 absolute，且必须是 Digitizer 触摸屏描述符而非绝对鼠标。
        只有当 Y71t 实测确实不接受触摸屏描述符时才回退 relative + 归零；
        「绝对鼠标不管用」不等于「绝对坐标不管用」，不要过早回退。

      fallback_trigger: "仅当触摸屏描述符在 Y71t 上确认无效时，才启用 relative_mode"

      verification_checklist:
        - "Y71t 开启开发者选项「指针位置」，看 tap 是否出现触点标记而不是鼠标箭头"
        - "确认 tap 的落点坐标与期望值一致（这一条同时验证 10000 逻辑范围映射是否正确）"
        - "验证 swipe 能真实滚动列表（UC3），单次 tap 无法暴露的问题会在 swipe 上暴露"
        - "验证键盘与触控能在同一连接中共存（发 HOME/BACK 后再 tap）"
        - "验证 BLE HID 与 WiFi 图传同时工作不断连（对应 risk R5）"
        - "修改过 Report Descriptor 后必须在 Y71t 上删除旧配对重新配对，主机缓存了旧的 Report Map"

      known_gotchas:
        - "主机缓存 Report Map：改描述符后不重配对，现象是「改了没反应」，极易误判为方案不可行"
        - "state 字节必须同时置位 Tip Switch 与 In Range（值 0x03）；只置 Tip Switch 会导致部分 ROM 无响应"
        - "抬起必须显式发送 state=0x00，否则会停留在按下状态导致后续指令行为异常"
        - "报告长度必须是 5 字节且与描述符完全一致，少一个字节会静默失效"
        - "MTU 建议设 185 左右，连接参数影响延迟；均与 latency_budget 相关"

    supported_actions:
      - "tap (x, y) — absolute 已确定：单次按下 + 抬起的触控报告，无需归零"
      - "swipe (x1,y1 → x2,y2, duration) — 用库内置的 swipeLinear / swipeBezier 插值"
      - "key (HOME / BACK / VOL_UP / VOL_DOWN / POWER_COMBO)"
      - "text (ASCII only, 中文不支持)"
      - "media (Play/Pause/Next/Prev)"
    latency: "100-300ms (BLE 固有延迟，可接受)"
    latency_note: "采用 absolute（单次报告），不存在 relative 那种 ×逼近步数的延迟放大；UI 无需额外标注"
    pairing: "Y71t 蓝牙配对一次，后续自动重连"
    reconnect_policy: "断连后自动恢复广播并重广告；连续 N 次失败则重启 BLE 栈而非整机（见 reliability）"

  usb_otg_hid:
    enabled: false
    note: "预留接口，固件中保留 USB HID gadget 代码但不默认启用"

  physical_keys:
    enabled: false
    note: "预留 GPIO → 继电器/FingerBot 按电源/音量键，本期不做"
    blocked_by: "缺少电源键/黑屏唤醒能力，手机一旦息屏或无响应即失去控制；纳入 v2.0 评估"

# ------------------------------------------------------------
# MVP 具体用例 —— 替代 automation 中「3-5 个固定用例」的模糊表述
# 用例按依赖递进排列，每个用例必须可独立重跑并产出证据
# ------------------------------------------------------------
use_cases:
  - id: "UC1"
    name: "基本导航"
    steps: ["发 BACK", "发 HOME", "按压 → 回到桌面"]
    asserts: "当前画面切换为桌面"
    covers: "BLE HID 基础通路是否被 Y71t 接受"

  - id: "UC2"
    name: "打开指定 App"
    steps: ["HOME", "在桌面 tap 目标 App 图标位置", "等待 2s"]
    asserts: "画面出现该 App 主界面"
    covers: "CAP→SCR→HID 全链路 + 图标定位精度"

  - id: "UC3"
    name: "列表滚动"
    steps: ["进入长列表界面", "swipe 从底部上滑", "等待 1s"]
    asserts: "画面内容相对上滑前发生变化，且滚动方向正确"
    covers: "swipe 插帧策略与安卓滚动方向约定"

  - id: "UC4"
    name: "定点返回"
    steps: ["在任意界面发 BACK", "连续 3 次"]
    asserts: "每步画面均发生变化，最终回到桌面"
    covers: "连发指令的时序可靠性与去抖"

  - id: "UC5"
    name: "长时稳定性"
    steps: ["以 5s 间隔循环执行 UC1 一次，持续 1 小时"]
    asserts: "全程无失联、无累计漂移，末尾落点误差仍在 acceptance 范围内"
    covers: "reliability 与 coordinate_mapping 的联合验证"

# ------------------------------------------------------------
# 端到端延迟预算 —— 用于设定正确预期，而非优化目标
# ------------------------------------------------------------
latency_budget:
  philosophy: "本方案对标 PiKVM 的低延迟不可比；目标是『发指令-看结果』节奏，不是实时操作"

  breakdown:
    - stage: "摄像头采集 + JPEG 编码"
      cost_ms: "40-80"
      note: "VGA 下主要成本，受 quality 参数影响"
    - stage: "WiFi → ESP32 → WS/HTTP"
      cost_ms: "5-20"
      note: "局域网；走 Tailscale DER 中继时另加"
    - stage: "Tailscale 加密/隧道开销"
      cost_ms: "5-40"
      note: "P2P 直连取低值，DER 中继且跨运营商时取高值"
    - stage: "Win10 canvas 渲染"
      cost_ms: "10-30"
      note: "取决于浏览器与机器负载"
    - stage: "点击指令下行至 ESP32"
      cost_ms: "10-30"
      note: "HTTP 往返"
    - stage: "BLE HID 报告"
      cost_ms: "100-300"
      note: "relative 模式需乘以逼近步数，是最大的单项"

  round_trip_estimate: "单次操作从点击到画面反馈约 0.5-1.5s"
  unsuitable_for: ["实时游戏", "高频拖拽", "需要即时视觉反馈的手速操作"]

  measurement_plan: >
    推荐用屏幕内计时器测：在 Y71t 上显示毫秒计时 App，
    控制端截图并 OCR/肉眼读出画面内的时间戳，与本地时间戳相减即为真实端到端延迟。
    注意做完即关闭 OCR 类行为，non_goals 中已排除 OCR 进入正式实现。

# ------------------------------------------------------------
network:
  topology: "Win10(广域网) ←→ Tailscale/WireGuard ←→ ESP32(内网 NAT)"
  vpn: "Tailscale (免费版，P2P 直连，无需公网 IP)"
  port_forwarding: false
  public_exposure: false
  server_required: "conditional（v1.5 起）"
  server_required_note: >
    v1.4 及以前为 false（subnet router 路径）。v1.5 因目标改为开源分发/大规模部署，
    默认传输路径改为 outbound_relay（设备主动出站到 broker），故该值变为 conditional：
    - outbound_relay（默认）：需要一个 WAN 可达的 broker，由部署者自建或自选
    - ipv6_direct（可选）：不需要任何服务器
    - lan_direct（开发/调试/已有 subnet router）：不需要服务器
    public_exposure 仍保持 false —— 默认路径下设备是主动出站方，自身不暴露在公网。

  esp32_access:
    status: "RESOLVED — 在 server_required=false 约束下，唯一解是同网段的 subnet router；这不是二选一的选择题"
    v1_5_scope: >
      【v1.5 定位变更】本节整体降级为 **lan_direct 后端的部署指南**。
      项目默认路径已改为 outbound_relay（见 scalability.selected_path），
      因此本节不再是所有部署者的必经之路；仅在选择 lan_direct 时才需要按本节操作。
      本节的技术结论（含四个坑与 subnet router 的选型）依然有效。
    conclusion: >
      【Q6 结案】在既定约束内，ESP32 侧没有任何解法：它跑不了 Tailscale 客户端，
      而"能联网就能远程控制"之所以在智能设备上成立，是因为那些设备端跑了一个
      常驻客户端（应用层连厂商 MQTT 云，或网络层自带 VPN 客户端）主动加入了某张网。
      ESP32 两者都做不到，只能做被动的服务端，因此必须有人替它出席。
      而 Tailscale 官方对"无法安装客户端的设备"（摄像头、NAS 老旧内核、打印机、
      交换机）给出的标准答案就是 subnet router —— 由同网段一台常开的 Tailscale 节点
      代为通告路由。因此本项目的答案收敛为：必须有一台常开节点。
      真正需要决策的只是"这台常开节点用谁来当"。
    hard_constraint: "该节点必须与 ESP32 在同一二层/三层网段内，并且处于常开状态"
    scope_note: >
      【措辞边界】「唯一解」的成立前提是 network.server_required=false —— 不引入自有公网服务器。
      远程控制在架构上必然需要一个「永远在线的中间人」，区别只在于由谁充当：
      厂商云 / 设备自带 VPN 客户端 / 本地常开节点 / 自建公网跳板。
      前两者 ESP32 均不可用（无厂商云、跑不动客户端），故排除后只剩后两者。
      若放宽该约束，ESP32 可改为主动出站连公网跳板从而免除常开本地节点，
      见 fallback_if_no_always_on_node —— 那条路可行但优先级最低。
    self_hosted_relay_comparison:
      question: "自建公网跳板（VPS/frp）与自建 subnet router，本项目选哪个？"
      verdict: "选 subnet router。在本项目的具体条件下差距是量级性的，不是偏好问题。"
      decisive_factors:
        bandwidth_path: >
          【决定性】subnet router 的最坏情况 ≈ 自建跳板的常态。
          Tailscale 打洞成功时，画面流只有"控制端→router"一段走公网，router→ESP32 是本地一跳（<1ms）；
          只有对称 NAT 打洞失败才落到 DER 中继。
          而自建跳板下两段都必然走公网，中继不是退路而是唯一路径，
          端到端延迟约为前者的 2 倍量级，且受 VPS 地理位置与带宽上限约束。
        security_surface: >
          规格 threat model 明确：任何人能访问 ESP32 的 HTTP API 即获得 Y71t 完整操作权。
          subnet router 下访问面是"内网 + Tailscale ACL 白名单"；
          自建跳板把它变成"公网可达 + token"，从被内网保护变成被全网扫描。
          同时画面流全程经过租来的机房，而 P2P 时不经过任何第三方。
        cost_shape: >
          subnet router 是一次性支出（¥0-300，复用现有设备则 ¥0）加约 5W 电费；
          VPS 是持续订阅（约 ¥24-100/月），三年即为 ¥1000-3000，且需续费、备案、加固、监控。
        bandwidth_budget: >
          按 video.bandwidth 1.2-3.0 Mbps 估算（取 2 Mbps，且控制端按需拉流）：
          每天连续看屏 2 小时 ≈ 53 GB/月，8 小时 ≈ 211 GB/月。
          后者已接近常见轻量服务器的月流量包上限，长时间看屏场景会先撞到流量墙而不是带宽墙。
        architectural_principle: >
          把复杂度放在资源充裕的一端。ESP32 是链条里最弱的一环（内存、算力、调试手段都最受限），
          subnet router 让它只做最擅长的事——在局域网里当一个被动的 HTTP 服务器；
          自建跳板则要求它额外维护到 VPS 的持久出站长连接、心跳与重连，把最难的活交给最弱的节点。
      when_to_reconsider: >
        仅当现场确实凑不出任何常开节点时才回到自建跳板
        （例如设备部署在无法放置路由/小主机的位置，或只能依赖 4G 热点）。
        届时应重新评估 security_surface 一项，至少补齐 TLS、来源白名单与速率限制。
      note: >
        顺带澄清一个容易混淆的点：Tailscale 本身已经是"不用自建云的自建云"——
        它提供托管控制面，数据面仍走 P2P。所以这里的对比不是"要不要有中间人"
        （中间人必然存在），而是"中间人的数据面放在租来的机房还是放在家里"。

    candidate_nodes:
      - option: "路由器本身跑 Tailscale（OpenWrt / 部分商用固件自带）"
        verdict: "最优：不增加物理设备，且路由器天然常开"
      - option: "树莓派 / 旧 x86 小主机 / NAS"
        verdict: "次优：稳定可控，但引入新硬件（需进 bom）与新的维护面"
      - option: "安卓电视盒子刷 Linux"
        verdict: "成本最低但可靠性最差，不推荐用于无人值守场景"
    explicit_prohibition: >
      不要试图用一台 Android 手机当 subnet router：Tailscale 的 Android 客户端
      不提供路由通告能力，只能作为普通节点。这是一个很容易想当然的坑。

    setup_steps:
      - "在选定节点上安装 Tailscale 客户端并登录同一 tailnet"
      - "开启 IP 转发：net.ipv4.ip_forward=1（Linux）"
      - "通告本网段：tailscale up --advertise-routes=<LAN CIDR>"
      - "在 admin console → Machines → 该节点 → Edit route settings 中批准路由（此步最常被漏掉）"
      - "从控制端用 ESP32 的**局域网 IP** 直连（例如 http://192.168.1.50），目标端无需任何改动"
      - "在 ACL 中限制仅指定控制端主机可访问该子网"

    gotchas:
      accept_routes_asymmetry: >
        【坑 1】--accept-routes 的平台默认值不对称：Windows / Android / iOS / macOS(App Store) 默认 true，
        而 Linux 上的 tailscaled 默认为 false。典型症状是"手机能连、电脑连不上"。
        本项目控制端是 Windows 因此无碍；但排障时若换用 Linux 客户端，必须补 tailscale set --accept-routes。
      snat_default: >
        【坑 2】--snat-subnet-routes 默认为 true，局域网侧设备看到的源 IP 是 subnet router 的地址。
        这正是 ESP32 无需任何回程路由就能应答的原因。**MVP 必须保持默认 true**，
        不要为了"日志里看到真实来源 IP"关掉它 —— 关闭后需要为 100.64.0.0/10 配置回程静态路由，
        而 ESP32 根本没有能力配合这件事。
      key_expiry: >
        【坑 3】Tailscale 节点密钥默认有过期时间，到期后节点静默掉出 tailnet，
        表现为"部署三个月后某天突然连不上"，且现场看不出任何异常。
        必须对 subnet router 关闭 key expiry，或改用 tag（tag 默认禁用过期）。
        这一条应写进部署检查清单，而不是等它发生。
      no_default_route: "【坑 4】不要通告 0.0.0.0/0 —— 那是 exit node 的用途，会引发非预期的全网流量"

    failure_mode_note: >
      subnet router 本身是一个新增的单点故障。运维上要能区分两种"远程不可用"：
      一种是 ESP32 挂了，一种是 router 挂了。两者现象相同但处置完全不同。
      建议在控制端 health 面板里保留一条"能否 ping 通 router 的 tailscale IP"作为判别分支。
    consistency_note: >
      network.server_required 仍为 false：subnet router 是本地网络的网关延伸，
      不承载业务、不引入云端服务。但它确实新增了本地常开依赖，已在 risk_register 登记。

    fallback_if_no_always_on_node:
      condition: "当且仅当现场凑不出任何常开节点时"
      structural_alternative: >
        把拓扑从"入站可达"改成"出站连接"：令 ESP32 作为 WebSocket 客户端主动连一台公网跳板
        （VPS / frp 服务端），控制端也连同一跳板。这样无需常开本地节点。
      why_lowest_priority: "代价是引入一台公网服务器，破坏了 server_required=false 的设计约束，
        同时把控制权暴露给第三方主机。仅作为兜底，不作为计划路径。"

  bandwidth_headroom: "需满足 video.bandwidth 的持续 1.2-3.0 Mbps，中继路径要留 2 倍余量"

# ------------------------------------------------------------
# 可扩展性 —— subnet router 要求的代价、三难困境与出路
# ------------------------------------------------------------
scalability:
  status: "RESOLVED — 2026-09-28 用户明确：以「开源分发 / 大规模异地部署」为目标"
  concern: >
    subnet router 不是"配置繁琐一点"，而是**每站点一次的人工部署步骤**：
    开源分发时每个使用者都得自己找一台常开节点并配置路由通告；
    大规模异地部署时是 N 个站点的 N 次现场配置，且每次配置都可能踩到
    network.esp32_access.gotchas 里的四个坑之一。这确实不友好，
    它是"零服务器 + 零公网暴露"这两个约束换来的代价，不是疏忽。

  trilemma:
    principle: "零服务器 / 零公网暴露 / 部署友好 —— 三者最多取二，不可兼得"
    current_choice:
      pick: "零服务器 + 零公网暴露"
      price: "需要现场常开节点（subnet router）"
    alternative_a:
      pick: "零服务器 + 部署友好"
      price: "放弃 public_exposure=false，改为 IPv6 直连或端口映射"
    alternative_b:
      pick: "零公网暴露 + 部署友好"
      price: "放弃 server_required=false，引入云中转 / MQTT broker / 跳板"
    note: >
      这三条边覆盖了所有可能，不存在第四种组合。因此"既要又不要"的诉求
      在架构上无解，只能先决定放弃哪一项。

  why_esp32_cannot_just_run_a_client: >
    最容易想到的解法是"给 ESP32 装个隧道客户端"，但这条路比看起来窄：
    社区确有基于 mbedTLS 的 ESP-IDF WireGuard 移植，能跑通加密与隧道封装；
    然而 WireGuard 只解决数据面，不解决三个前提 —— 对端 endpoint 要稳定可达
    （家庭宽带 IP 会变）、对称 NAT 需要中继、密钥与节点信息需要分发。
    这三件事正是 Tailscale 控制面在做的事，而 ESP32 扛不住完整的 tailscaled。
    结论：能跑 WireGuard ≠ 能自组一张可漫游的网。

  underrated_option_ipv6:
    summary: >
      IPv6 是三难困境里最被低估的一条边：若两端都有全球单播地址，
      ESP32（lwIP 支持 IPv6）可以直接被访问，无需 VPN、无需常开节点、无需服务器。
    caveats:
      - "家庭路由默认常开 IPv6 防火墙，入站仍需放行一条规则（仍属公网暴露）"
      - "运营商前缀会轮换，地址变化需要 DDNS 或上报机制配合"
      - "一旦公网可达，security.mvp_minimum 的强度就不够了：token 鉴权需升级，并补速率限制与失败锁定"
    verdict: "作为可选 backend 值得留位，但不适合作为唯一默认路径"

  recommended_direction:
    principle: >
      开源友好 ≠ 替所有人选一种网络方案，而是**把网络层做成可插拔的传输抽象**，
      让部署者按现场条件选，上层（HTTP API / 标定 / 换算 / UI）完全不感知。
    transport_backends:
      - backend: "lan_direct"
        when: "同网段或已部署 subnet router（当前默认）"
        cost: "零服务器、零暴露；代价是需常开节点"
      - backend: "ipv6_direct"
        when: "两端均有全球单播 IPv6 且已放行入站"
        cost: "零服务器、零常开节点；代价是公网暴露"
      - backend: "outbound_relay"
        when: "现场凑不出常开节点，ESP32 主动出站连 broker / 跳板"
        cost: "零常开节点、可不经公网暴露（取决于 broker 位置）；代价是需要服务器"
    interface_boundary: >
      抽象应只暴露三个能力：connect / send_command / stream_frames，
      外加一个 report_endpoint（上报自身可达地址）。这样新增 backend 不动上层。
    milestone_impact: >
      若在 MVP 前就做抽象，会拖慢 M1-M2；更稳妥的是 MVP 先只实现 lan_direct，
      但**在代码结构上预留 backend 接口**，避免日后重构。此决策应早于 step_9（HTTP API）落地。

  tailscale_specific_scale_tip: >
    即使继续走 subnet router，规模化时也不要逐台授权：
    用 Tailscale **tag + ACL 规则**批量放行，而不是给每台节点单独授权。
    tag 恰好还默认禁用 key expiry，与 R14 的缓解措施同向。

  decision: >
    2026-09-28 已定：以「开源分发 / 大规模异地部署」为目标。
    据此在三难困境中明确取舍 —— **放弃「零服务器」，保住「零公网暴露 + 部署友好」**。

  selected_path:
    choice: "三难困境的 B 边：零公网暴露 + 部署友好"
    rationale: >
      大规模部署的本质诉求是「一个中心管 N 个站点」，而只有设备主动出站到中心
      才能做到零现场配置（无 IPv6 依赖、无常开节点依赖、无端口映射）；
      同时设备仍是主动出站方，自身不暴露在公网，public_exposure=false 得以保留。
      在三条边里，这是对"部署友好"代价最小、且唯一能天然支持集中管理的方案。
    backend_priority:
      - rank: 1
        backend: "outbound_relay"
        role: "默认路径"
        note: "设备主动出站连 broker；零现场配置、天然支持 N 台集中管理。代价是需要一个 broker"
      - rank: 2
        backend: "ipv6_direct"
        role: "面向不想自建 broker 的个人用户"
        note: "两端有全球单播 IPv6 且放行入站时可用；零服务器，但公网暴露，需强化鉴权"
      - rank: 3
        backend: "lan_direct"
        role: "开发调试 / 已部署 subnet router 的既有站点"
        note: "保留为可选项，不再是默认"
    subnet_router_status: >
      降级为 lan_direct 后端下的一种实现，不再是必选项。
      network.esp32_access 全节内容仍然有效，但仅作为该后端的部署指南。
    auto_selection_rule: >
      启动时按 lan_direct → ipv6_direct → outbound_relay 的成本从低到高探测可行性？
      不 —— 反向更合理：优先尝试最"轻依赖"的 ipv6_direct（若已启用且入站可达），
      否则回落已配置的 outbound_relay；lan_direct 仅在未配置 broker 时用于本地。
      探测必须由控制端发起并给出明确诊断，不能让设备静默切换（否则排障无从下手）。

  deployment_at_scale_requirements:
    premise: >
      目标改为大规模部署后，真正的瓶颈从"网络怎么打通"转移到了"设备怎么管"。
      以下六项在 MVP 现有设计中均不成立或明显不足，是本次目标变更的主要连带工作量。
    provisioning:
      gap: "MVP 假设 WiFi 凭据已知（手动配网/硬编码），100 台时不可行"
      requirement: "零接触配网：ESP-IDF wifi_provisioning（SoftAP 或 BLE + protocomm 安全通道），由控制端扫码/配网页下发凭据"
    device_identity:
      gap: "security.mvp_minimum 是『静态 token，串口输出一次人工录入』，且多设备可能复用同一 token"
      requirement: >
        每设备唯一身份与凭据，烧录时注入或首次启动时生成并安全导出；
        禁止全网共用 token。broker 侧按 device_id 做 ACL 隔离。
    registry_and_discovery:
      gap: "现有设计靠人记住每台 ESP32 的 IP；大规模下必须有注册表"
      requirement: "设备上线即向 broker 注册（含 device_id / 能力 / 版本），下线用 LWT 标记；控制端从注册表取设备列表"
    ota:
      gap: "security.mvp_minimum 中『未使用 OTA 则其代码路径保持禁用』，MVP 走串口烧录"
      requirement: "大规模下 OTA 从可选项变为必选项，且必须签名校验；需按批次灰度与回滚能力"
    calibration_for_end_users:
      gap: "9 点人工标定对个人用户门槛过高，是开源分发 adoption 的主要障碍"
      requirement: >
        一键自动标定：由 ESP32 提供一个全屏标定网格页面，用 Y71t 自带浏览器打开后
        全屏显示；ESP32 拍一帧，自动检测网格交点（CAP 坐标由图像得到，SCR 坐标由网格定义已知），
        直接求解 H 并跑留一残差自检。无需人工点 9 次，也无需在被控端装 App。
      feasibility_note: "Y71t 可通过局域网访问 ESP32 的 HTTP 服务，此方案不违反 non_goals（不装 App、不依赖 ADB）"
    board_and_optics_matrix:
      gap: "hardware.pinout 目前是单一参考，摄像头镜头视场还要求现场反推"
      requirement: >
        板级配置外置为 build-time profile（不同 ESP32-S3 载板 / 摄像头模组），
        并对已验证组合提供预置的 pinout 与推荐工作距离，减少现场试错。
    licensing:
      gap: "tech_stack.libraries 中第三方依赖（如 Autfy/ESP32-BLE-HID）的许可证未确认"
      requirement: >
        开源分发前必须完成依赖许可证清点并确认与项目许可证兼容；
        同时把描述符规格固化在本文件内（R1 已有此要求），降低对上游库的硬依赖。
    broker_hosting_decision: >
      2026-09-28 已定：**项目方提供 broker**（官方托管实例），用户开箱即用。
      由此引出的架构、合规与信任问题见顶层章节 broker_service，此处不再展开。

# ------------------------------------------------------------
# Broker 服务 —— 项目方托管模式下的架构、信任与合规约束
# ------------------------------------------------------------
broker_service:
  status: "RESOLVED — 2026-09-28 用户决定：由项目方提供 broker"
  decision: "项目方运营官方托管实例，用户开箱即用，无需自建"

  reference_model: >
    采用 Matrix / Synapse 那种结构：**开源协议 + 开源服务器实现 + 官方托管实例 + 允许自托管**。
    这样"官方托管"是便利而不是锁定 —— 这是本项目区别于它本来要反对的厂商云的关键。

  the_new_problem: >
    项目方一旦运营 broker，就立刻获得一项此前不存在的能力：
    **可以看到每一个用户的手机屏幕内容，并可以向任意设备下发指令**。
    这与 security.threat_model 里"资产价值极高"的判断叠加后，
    是本决策引入的最大问题 —— 它不是运维问题，是信任问题。

  three_preconditions:
    note: "官方托管要成立，必须同时满足以下三条；缺任何一条都不如让用户自建"
    p1_e2e_encryption:
      requirement: "端到端加密：broker 只转发密文，永远无法解密"
      key_exchange: "密钥带外交换 —— 配网时由控制端生成随机 PSK，经 BLE provisioning 安全通道或扫码注入设备；禁止经由 broker 传递密钥"
      cipher: "视频与指令统一用 AEAD（AES-256-GCM 或 ChaCha20-Poly1305），会话密钥可轮换"
      esp32_feasibility: >
        ESP32-S3 有 AES / SHA / RSA / ECC 硬件加速，mbedTLS 可直接利用，
        1-3 Mbps 的 AEAD 开销可接受。但**必须实测**：这项开销会与 R5 的共存压测叠加，
        需并入 tech_stack.coexistence.acceptance_test 一并评估。
      accepted_constraint: "加密后 broker 无法转码、无法生成缩略图、无法录制 —— 这是必须接受的设计约束"
    p2_self_host_first_class:
      requirement: "自托管是一等公民，官方实例只是可选项"
      why: >
        否则项目就变成了它本来要反对的东西：官方一停服，所有设备变砖，
        这正是 v1.4 评估厂商云时给出的负面理由。开源的意义在于用户随时可以搬走。
      implementation: "broker 自身必须开源且提供一键部署（docker-compose），并与官方实例协议完全兼容"
    p3_sustainable_ops:
      requirement: "成本与合规可持续，否则服务不可信"
      see: "broker_service.economics 与 broker_service.compliance"

  architecture_refinement:
    status: "CONFIRMED — 2026-09-28 用户确认；详细设计见 broker_service.transport_architecture"
    problem: >
      v1.5 把默认后端定义为 outbound_relay（设备主动出站到 broker）。
      若所有流量都过 broker，则带宽成本与信任风险同时被放大。
    refinement: >
      把 broker 的角色细化为 **信令服务器 + 中继兜底**，而不是全量中转：
      设备仍主动出站注册到信令服务（保持 outbound 特性与零现场配置），
      但数据流优先走 P2P（ipv6_direct 或打洞成功时），仅在打洞失败时由 broker 中继。
    reference: "这与 WebRTC 的 signaling + TURN 结构是同一个模型"
    benefit: >
      同时解决两件事：带宽成本大幅下降（broker 多数时候只承载信令），
      且即便走中继，broker 拿到的也是 E2E 密文 —— 成本与信任同时收敛。

  transport_architecture:
    status: "CONFIRMED（v1.7）—— 架构结论保留"
    v1_8_status: >
      PARKED。按 execution_policy「跑通第一」，本节的实施（P2P 优先 / 三级降级）
      推迟到端到端链路跑通之后；MVP 期间走 execution_policy.mvp_transport_decision
      定义的全量中转。架构结论本身不撤销，仅在跑通后启用。
    core_split:
      principle: "按流量特性分流，而不是让所有流量走同一条路"
      commands:
        path: "控制端 → broker → ESP32（始终经 broker）"
        why: "指令是几十字节级，带宽成本可忽略，但必须可靠送达 —— 走 broker 的 TCP 长连接天然可靠"
      video:
        path: "控制端 ←→ ESP32（P2P 直连优先）"
        why: "视频是 Mbps 级，占几乎全部带宽；且 MJPEG 每帧独立，可容忍丢帧 —— 适合走 P2P"
      note: "E2E 加密对两条路径都适用；broker 转发的是指令密文，中继时转发的是视频密文"

    three_tier_fallback:
      - tier: 1
        path: "IPv6 直连"
        why_first: "无 NAT，两端有全球单播地址即可直达，成功率接近 100%，且零服务器流量"
        precondition: "两端均具备 IPv6，且家庭路由已放行入站（这是唯一需要现场配置的一项）"
      - tier: 2
        path: "IPv4 UDP 打洞（P2P）"
        how: "broker 交换双方公网 endpoint，双方同时互发 UDP 探测包建立 NAT 映射"
        caveat: "家宽 CGNAT / 对称 NAT 下成功率下降，见 transport_architecture.nat_reality"
      - tier: 3
        path: "broker 中继"
        when: "打洞失败"
        note: "此时仍走 E2E 密文，broker 只做转发 —— 这是中继能被接受的前提"

    session_flow:
      - step: 1
        desc: "ESP32 开机后主动出站，与 broker 建立 TCP 长连接并注册 device_id（零现场配置的来源）"
      - step: 2
        desc: "控制端同样连 broker，从注册表取得设备列表与在线状态（LWT 标记离线）"
      - step: 3
        desc: "控制端请求接入某设备；broker 交换双方的公网 endpoint（IPv6 地址 + IPv4:port）"
      - step: 4
        desc: "优先尝试 IPv6 直连；不可用时双方同时互发 UDP 探测做 IPv4 打洞"
      - step: 5
        desc: "探测成功即建立 P2P 视频通道，并向控制端上报当前实际路径（供诊断）"
      - step: 6
        desc: "失败则回落 broker 中继，并在健康面板标明『当前为中继路径』"

    session_keepalive: "NAT 映射有超时（通常数十秒到数分钟），需定期 keepalive 维持，否则通道静默失效"
    session_diagnostic_rule: >
      路径选择必须由控制端显式上报，禁止设备端静默切换 ——
      否则"画面变卡"会被误诊为摄像头或 WiFi 问题，而不是"其实走了中继"

    udp_fragmentation:
      problem: >
        现有图传是 MJPEG over WebSocket（TCP）。改走 P2P 后需用 UDP，
        而 VGA 单帧 JPEG 常在 20-60 KB，远超 MTU，必须分片。
        JPEG 不可部分解码，**丢任意一个分片则整帧报废**。
      quantification: >
        单帧 15 KB（约 12 个分片）在 0.5% 丢包下整帧存活率约 94%；
        单帧 40 KB（约 33 个分片）在同等丢包下存活率降至约 85%。
        所以单帧大小直接决定有效帧率，不是线性的。
      why_tolerable: >
        MJPEG 每帧独立、无帧间依赖，丢帧只表现为帧率下降，不会花屏或累积错误 ——
        这正好适配 UDP 的不可靠语义，是本方案能成立的关键。
      engineering_constraints:
        - "分片 payload 对齐 MTU（约 1200 字节），避免 IP 层再分片"
        - "P2P 路径下主动压低单帧大小（降 quality / 降分辨率），把有效帧率换回来"
        - "带 seq 与帧号，接收侧整帧缺片即丢弃，不做重传（重传对实时视频无意义）"
        - "控制指令绝不走这条不可靠通道，始终走 broker"

    nat_reality:
      warning: >
        **必须诚实修正对 P2P 成功率的预期**：中国家庭宽带 IPv4 相当比例处于
        运营商级 NAT（CGNAT）之下，对称 NAT 场景 UDP 打洞会失败。
        因此"带宽成本大幅下降"是有条件的，不是必然结果。
      consequences:
        - "IPv6 的价值因此上升 —— 它才是真正稳定的零中继路径，而非 IPv4 打洞"
        - "中继比例可能显著高于乐观估计，broker_service.economics 的估算需保留余量"
        - "成本规划应按『部分用户走中继』建模，而不是假设中继是极少数"
      measurement_required: >
        这一项无法靠桌面推算收敛：需在真实家宽 / 4G 环境下统计打洞成功率与中继占比，
        并据此修订成本模型。应作为 M4 之后的专项测量项。

    relations:
      - "与 R16（broker 单点故障）：P2P 优先降低了 broker 的带宽压力，但没有消除单点 —— 信令仍依赖它"
      - "与 R21（打洞成功率）：本节的乐观预期由其约束"
      - "与 R5（BLE/WiFi 共存）：新增 UDP 收发会改变 WiFi 侧负载特征，需并入 1 小时压测"

  economics:
    traffic_model: >
      按 2 Mbps、控制端按需拉流估算，单设备约 0.9 GB/小时。
      若官方实例承接 100 个日活（每天 1 小时）≈ 2.6 TB/月；
      1000 个日活 ≈ 26 TB/月。按国内云流量 0.5-1 元/GB 计，
      后者约 **¥1.3 万-2.6 万/月**，这是持续支出而非一次性成本。
    mitigations:
      - "严格执行按需拉流（reliability 已有此设计），禁止 24h 常推"
      - "按 architecture_refinement 让 P2P 承担主要流量，broker 只做信令与兜底"
      - "免费额度 + 超出限流；或按设备数/流量分级"
      - "探索赞助 / 付费订阅 / 企业私有部署三条收入线"
    warning: >
      带宽是唯一随用户数线性增长且无法靠优化消除的成本。
      在商业模式未定之前，不应承诺"永久免费无限流量"。

  compliance:
    items:
      - "服务器在中国境内运营需 ICP 备案；使用国内云必须先解决这个问题"
      - "传输内容包含用户手机屏幕，属个人信息，触发《个人信息保护法》相关义务：
         需明确告知、最小必要、留存期限与删除机制"
      - "需提供隐私政策与服务条款，并说明 broker 看不到明文（E2E 是合规叙事的核心）"
      - "境外部署可暂缓备案，但延迟与合规地都要重新评估"
    note: "合规不是上线前补一份文档的事，它会反向约束架构（例如日志不能留存可识别内容）"

  public_exposure_effect: >
    network.public_exposure 仍保持 false —— 设备自身不在公网暴露。
    但需新增一项认知：**数据暴露给了项目方**。因此本决策等价于
    把"零公网暴露"替换为"零公网暴露 + 信任项目方"，而这个信任必须靠
    p1_e2e_encryption 在技术上削弱，而不是靠声明。

  open_items:
    - "官方实例的地域（境内需备案 vs 境外延迟）"
    - "商业模式与免费额度"
    - "SLA 目标与停服预案（必须提前公告迁移路径，且自托管始终可用）"
    - "broker 实现的开源许可证与贡献流程"

# ------------------------------------------------------------
# 安全与访问控制 —— 内网不等于安全
# ------------------------------------------------------------
security:
  threat_model: >
    本系统的资产价值很高：控制端等价于持有 Y71t 的完整操作权
    （可见屏幕内容 + 可点击 + 可输入）。
    任何人只要能访问 ESP32 的 HTTP API，就获得了同样的能力。

  # v1.6 新增：按"谁能造成什么后果"列主体，而不是只按攻击手法列
  threat_actors:
    - actor: "能访问 ESP32 HTTP API 的任何人"
      capability: "完整控制权（看屏 + 点击 + 输入）"
    - actor: "broker 运营方（v1.6 起为项目方自身）"
      capability: >
        若不加密，可读取所有用户的屏幕流并向任意设备下发指令。
        这是"项目方提供 broker"这一决策引入的新主体，
        也是本项目迄今集中度最高的风险 —— 详见 broker_service.the_new_problem。
      mitigation: "端到端加密（broker_service.three_preconditions.p1_e2e_encryption）"
    - actor: "持有设备物理访问权的人"
      capability: "等同完全控制（BLE 配对凭据在 ESP32 侧）"

  layers:
    network:
      measure: "Tailscale ACL 白名单，仅允许指定 Win10 主机访问 ESP32 的 80 端口"
      note: "不要依赖『反正在内网』这种假设"
    application:
      measure: "HTTP/WS 均需鉴权；MVP 至少实现静态 token"
      v1_6_note: >
        v1.6 起该条只是下限，不再足够：需升级为每设备唯一凭据 + 端到端加密
        （broker 只转发密文），密钥带外交换而非经 broker 传递。
        详见 broker_service.three_preconditions.p1_e2e_encryption 与 R17 / R20。
      rule: "禁止明文口令硬编码写死在固件源码并进 Git"
      suggested_flow: "首次启动在 NVS 生成随机 token，从串口输出一次，人工录入控制端"
    firmware_update:
      measure: "OTA 需校验签名，禁止未签名固件刷入"
      note: "MVP 阶段可直接禁用 OTA，走串口烧录，减少攻击面"
    physical:
      measure: "拿到 ESP32 硬件 ≈ 拿到全部控制权"
      note: "设备不应部署在不可信物理环境中"
    bluetooth:
      measure: "BLE HID 配对凭据保存在 ESP32 侧，Y71t 会信任持有该身份的设备"
      note: "风险可接受，但需知悉：换板子后 Y71t 需重新配对"
    logging:
      measure: "串口日志不得输出 token / PSK / 配对密钥"
      note: "排障时临时开启，交付前关闭"

  mvp_minimum:
    - "Tailscale ACL 限制来源主机"
    - "HTTP/WS token 鉴权"
    - "串口日志脱敏"
    - "未使用 OTA 则其代码路径保持禁用"

# ------------------------------------------------------------
controller:
  platform: "Windows 10"
  ui: "浏览器 (Chrome/Edge) 或本地 Python UI"
  display: "canvas 显示 MJPEG 流"
  controls: "虚拟键盘 + 鼠标/触控 + 预设按钮 (Home/Back/Swipe)"
  backend: "MVP：控制端连 broker（project-operated）中转 → ESP32 本地 HTTP/WS API；broker 仅透传不解包"
  no_external_server: true
  backend_note: >
    no_external_server 指不依赖任何第三方/外部云服务；broker 为项目方自建（first-party），
    等价于「零外部云依赖」。LAN-direct（控制端直连 ESP32 IP）保留为可选部署形态。

  # --- UI 必须承担的标定职责 ---
  calibration_ui:
    required: true
    features:
      - "标定模式开关：叠加 3x3 网格指引层"
      - "逐点采集点击并形成 (CAP, SCR) 样本表"
      - "实时显示拟合残差，超阈值高亮该点要求重采"
      - "标定结果落盘 JSON（按 device_id 分 profile），支持导入导出"
    coordinate_display: "鼠标悬停时实时显示当前 CAP 坐标及换算后的 SCR 预测坐标"
    decision: "MVP 做 Win10 本地页面（算力与调试便利），ESP32 仅保留最小状态页"

  coordinate_mapper_module:
    location: "Win10 客户端（MVP 决策，见 coordinate_mapping.runtime_placement）"
    responsibility: "持有 H 矩阵，执行 CAP→SCR→HID 全链路换算，向 ESP32 下发 HID 结果"
    interface: "Win10: map(cap_xy) -> hid_xy；ESP32 侧仅负责把 HID 值打包成 BLE 报告"

  health_panel:
    required: true
    source: "GET /api/v1/health"
    fields: "uptime / heap / free_psram / chip_temp / fps / wifi_rssi / ble_connected"
    purpose: "长跑排查的第一步永远是先看健康面板"

# ------------------------------------------------------------
# 可靠性 —— automation.focus 明确写了稳定性测试，但缺少对应设计
# ------------------------------------------------------------
reliability:
  target: "7×24 无人工干预；MVP 阶段先通过 72 小时 soak test"

  watchdog:
    enabled: true
    hardware_wdt: "启用任务看门狗，超时阈值 8s"
    policy: "优先重启单个任务（camera task / http task），多次无效再整机重启"
    reason: "整机重启会丢一次链路状态，排障时反而更难定位"

  reconnect:
    wifi: "断线自动重连，指数退避，连续失败达阈值后重启网络栈"
    ble: "Y71t 断开后恢复广播；连续重连失败则重置 BLE 栈"
    order: "先恢复 WiFi 再恢复 BLE：图传是判断状态的前提"

  degradation_ladder:
    note: "资源紧张时按此顺序降级，不要一步到位停机"
    steps:
      - "降低 MJPEG 帧率"
      - "降低 JPEG 画质"
      - "降低分辨率 VGA → QVGA"
      - "暂停图传，仅保留控制通路"
      - "最后才整机重启"

  health_reporting:
    endpoint: "GET /api/v1/health"
    interval_ms: "由控制端按需拉取，ESP32 端不主动推送以免加重负载"
    must_include: "last_reset_reason —— 用于区分看门狗重启、欠压重启、panic"

  crash_diagnostics:
    - "保留 panic handler 输出到串口"
    - "记录最后 N 次 reset reason 到 RTC memory / NVS"
    - "建议初期保留串口日志采集，定位稳定后再断开"

  anti_brownout: "电源端并联电容，见 hardware.power.brownout_risk"

  soak_test:
    duration_h: 72
    workload: "以 5s 间隔循环执行 UC1"
    pass_criteria: "无失联、无累计漂移、堆内存无单调下降趋势"
    fail_action: "记录 heap/uptime/reset_reason 曲线后复盘，不允许直接重启了事"

# ------------------------------------------------------------
automation:
  use_case_count: "5（见 use_cases）"
  focus: "功能验证 + 稳定性测试"
  framework: "Python 脚本 (pytest optional)"
  execution: "Win10 本地 Python → HTTP/WS 指令 → ESP32 → BLE HID → Y71t"
  assertions: "截图存盘 + 人眼/简单图像比对 (不做 OCR)"
  ci_integration: false
  parallel_devices: false
  recovery_on_failure: "人工介入 (本期不做自动恢复)"

  evidence_policy: >
    每次运行必须落盘：原始帧 + 指令序列 + 时间戳 + 期望/实测结果。
    没有证据的运行等于没跑，也不利于回溯漂移类问题。

  # --- 坐标链路专项断言 ---
  coordinate_assertions:
    required: true
    cases:
      - "标定自检：加载 H 后重投影 9 个标定点，全部残差落在 error_budget 范围内"
      - "点击回环：对已知目标点发 tap，拉回新帧做人眼/图像比对确认命中"
      - "漂移观测：连续 20 次 tap 同一目标，记录偏差序列，确认无单调漂移（relative 模式必测）"
      - "边界测试：点击屏幕边缘区域，确认误差仍在 acceptance.edge 范围内"
    artifact: "每次断言保存原始帧 + 期望坐标 + 实测坐标三元组，便于离线复盘"
    note: "此类断言属坐标链路体检，应与业务用例脚本分开独立运行"

# ------------------------------------------------------------
extensibility:
  multi_device:
    supported: true
    method: "每台 ESP32 分配 device_id，Win10 客户端做设备列表切换"
    network: "同一 Tailscale 网络下通过 hostname/IP 区分"
    per_device_calibration: true
    calibration_profile: >
      每台 Y71t/摄像头组合的安装几何都不同，标定矩阵不可跨设备复用。
      需按 device_id 建立独立 calibration profile，切换设备时同步切换 H 矩阵。

  physical_keys_future:
    gpio_reserved: true
    relay_compatible: true
    fingerbot_compatible: true
    motivation: "补上黑屏/死机时的最后手段：物理按电源键与音量键"

  usb_otg_future:
    code_reserved: true
    validation_required: "验证 Y71t 是否接受 ESP32 为 USB HID 设备"

# ------------------------------------------------------------
non_goals:
  - "不采 HDMI/DP (Y71t 无视频输出)"
  - "不装 APP / 不依赖 ADB 主控"
  - "不做 OCR / AI 视觉"
  - "不录制视频"
  - "不控 Recovery / 强制重启 (本期)"
  - "不裸公网暴露"
  - "不追求低延迟"
  - "不买 NanoKVM / Comet Q / PiKVM (自研 ESP32 方案)"
  - "不做企业级多用户管理"
  - "不做全自动标定 (MVP 采用人工点击 9 点的方式)"
  - "不做相机内参标定与逐点 pixel-perfect 畸变建模 (单应矩阵够用即可)"
  - "不做美颜/画质增强类图像处理 (FOV 就是所见即所得)"

# ------------------------------------------------------------
tech_stack:
  platform: "ESP-IDF 5.x 或 Arduino-ESP32 3.x"
  language: "C/C++ (ESP32 固件) + Python (Win10 控制端)"
  decision: "MVP 用 Arduino-ESP32 3.x：CameraWebServer 与 BLE 库现成，跑通优先"

  coexistence:
    status: "RESOLVED (desk) — 原理成立且有官方背书；风险已从『能不能』降级为『稳态 QoS』"
    conclusion: >
      【Q3 结案】ESP32-S3 只有一套 2.4GHz 射频，WiFi 与 BLE 通过时分复用共享。
      关键在于：Espressif 官方共存矩阵中，Wi-Fi STA Connected + BLE Connected
      这一格明确标注为 Y（supported，performance is stable），
      且文档写明在该共存方案下，一个共存周期内 WiFi 与 BLE **各占约 50% 时间片**。
      这说明"同时跑"是被官方支持的常态组合，而非 hack。
      所以真正需要验证的从来不是"会不会冲突"，而是"两边各分到的一半资源够不够用"。
    official_source: "https://docs.espressif.com/projects/esp-idf/en/release-v5.0/esp32s3/api-guides/coexist.html"
    why_the_library_is_not_the_risk: >
      Autfy/ESP32-BLE-HID 的 README 明示支持 Wi-Fi 并行并提供了验证示例，
      但这只能证明"能同时连上"，不能证明"稳态 QoS 达标"——后者必须自己压测。

    memory_contention:
      warning: >
        容易被忽略的第二条竞争线不是射频，而是**内存与总线带宽**。
        camera 的 frame buffer 走 PSRAM 且由 DMA 搬运，WiFi 的 TX buffer 也要吃 PSRAM 带宽，
        两者叠加时真正的瓶颈可能在这，而不是 2.4GHz 时隙。
        压测时必须同时看 heap 最低水位与帧率，不要只看"有没有断连"。

    tuning_knobs:
      ble_stack_choice:
        recommendation: "优先评估切到 NimBLE"
        reason: "NimBLE 约 50KB RAM，Bluedroid 约 110KB；本项目同时跑 camera + WiFi + MJPEG，内存是最紧的资源"
        unresolved: >
          Autfy/ESP32-BLE-HID 基于 T-vK 系列，通常默认走 Bluedroid（Arduino-ESP32 的默认栈）。
          能否无痛切到 NimBLE 需要实测确认；若不能，则必须接受 Bluedroid 的开销并相应收紧 fps 与画质预算。
          （这是 v1.4 新开出的一项实测项，但不阻塞 M2，因为它影响的是余量而非可行性。）
      task_pinning:
        recommendation: "把 WiFi 任务与 BT controller/host 任务分到不同 CPU 核"
        rationale: "官方文档给出的共存性能优化建议；ESP32-S3 是双核，有条件执行"
        knobs: "CONFIG_BT_CTRL_PINNED_TO_CORE_CHOICE / CONFIG_BT_NIMBLE_PINNED_TO_CORE_CHOICE + CONFIG_ESP_WIFI_TASK_CORE_ID"
      coex_preference:
        api: "esp_coex_preference_set()"
        usage: "当视频与控制出现明显此消彼长时再调；MVP 保持 BALANCE，除非压测证明单侧优先更优"
      connection_params:
        api: "keyboard.setPreferredConnectionParams(min, max)"
        tradeoff: >
          connection interval 越小 HID 延迟越低，但 BLE 抢占 RF 越频繁，会压低 WiFi 吞吐。
          这是本项目唯一一处"输入延迟"与"视频流畅"直接互为代价的地方，必须按实测定点，
          不能照抄默认值。
      mtu:
        api: "keyboard.setMTU(185)"
      avoid:
        - "不要在 WiFi 正在连接/扫描期间反复启停 BLE 广播 —— 会导致广播间隔抖动，
           表现为「手机有时搜不到、有时连不上」。这是共存场景最典型的疑难杂症。"

    acceptance_test:
      description: "把'没断连'升级为可量化的稳态指标；编译通过不算通过"
      duration: "连续 1 小时"
      load: "持续 MJPEG 推流 + 每 5 秒一条 HID 指令（混合 tap / swipe / key）"
      metrics:
        - "视频：帧率不低于目标值的 80%，无连续 3 秒以上的停流"
        - "输入：HID 指令零丢失（对端计数核对），无超过 500ms 的响应尖刺"
        - "链路：全程零 BLE 断连、零 WiFi 重连"
        - "资源：heap 最低水位有安全余量，未见持续单向下降（防内存泄漏）"
      judgement: "任一指标不达标，优先降 fps/画质而不是先怀疑 BLE"

    degradation_path:
      - "第一档：降 fps（15 → 10）与画质，给 BLE 让出时隙"
      - "第二档：错峰 —— 在发送 HID 指令的短窗口内主动抑制取帧，
         让 HID 独占几十毫秒。人的操作是间歇性的，这个代价几乎不可感知，是性价比最高的一招"
      - "第三档：按需拉流 —— 仅在需要观察时推流，纯操作时段降到静态帧轮询"
      - "不做：试图把两条链路分到不同频段 —— WiFi 2.4G 与 BLE 本就同处 2.4GHz，物理上无解，不必浪费时间尝试"

  references:
    ble_hid:
      - name: "ESP32-BLE-Keyboard"
        url: "https://github.com/T-vK/ESP32-BLE-Keyboard"
        usage: "BLE 键盘 + 媒体键"
        coordinate_mode: "键盘/媒体，不涉及坐标"
      - name: "ESP32-BLE-Mouse"
        url: "https://github.com/T-vK/ESP32-BLE-Mouse"
        usage: "BLE 鼠标 (相对)"
        coordinate_mode: "relative"
      - name: "ESP32-BLE-Combo"
        url: "https://github.com/peter-pakanun/ESP32-BLE-Combo"
        usage: "键鼠二合一"
        coordinate_mode: "relative"
        status: "作为 Autfy 库的上游依赖，不建议单独使用"
        warning: "单独使用不支持绝对坐标；仅支持相对鼠标，无法承载本方案的 tap/swipe"

      - name: "ESP32-BLE-HID (asterics)"
        url: "https://github.com/asterics/ESP32-BLE-HID"
        status: "BROKEN — 2026-09-28 实测该 URL 返回 404，仓库疑似已删除或私有化"
        note: "v1.1/v1.2 曾把它列为实现参考，现已作废。后续不要再引用此链接。"

      - name: "ESP32-BLE-Abs-Mouse (sobrinho)"
        url: "https://github.com/sobrinho/ESP32-BLE-Abs-Mouse"
        usage: "绝对坐标触控，本方案描述符规格的来源"
        coordinate_mode: "absolute"
        key_specs: "Digitizer/Touch Screen 描述符；Report ID 0x01；5 字节报告；X/Y 各 16bit，Logical Max 10000；state 0x03=按下、0x00=抬起"
        android: "README 明确标注 Compatible with Android"

      - name: "ESP32-BLE-HID (Autfy)"
        url: "https://github.com/Autfy/ESP32-BLE-HID"
        selected: true
        usage: "本项目首选：键盘 + 绝对坐标触控的复合 BLE HID 设备"
        coordinate_mode: "absolute"
        key_apis: "setScreenSize / setLogicalRange / setCalibrationOffset / sendAbsolutePixel / swipeLinear / swipeBezier"
        why_selected:
          - "键盘与绝对触控在同一连接上共存，同时支持 BACK/HOME/text 与 tap/swipe"
          - "README 明确宣称可与 Wi-Fi 并行工作，提供 BLE HID + WiFi 验证示例，直击本方案的最大耦合风险"
          - "已内置滑动轨迹插值与坐标偏移校正，与我们 residual_offset 的设计吻合"
          - "已封装行式指令协议（TAP/SWIPE/BEZIER/TEXT/OFFSET/SET_SCREEN），可作为 ESP32 侧接口蓝本"
        maintenance: "单作者项目，活跃更新至 2026-02；评估结论：可用，但需 fork 并锁定版本（见 risk R11）"
        verified_on: "2026-09-28（URL 可达；README 内容与本文档引用一致）"
        api_surface_note: >
          除 coordinate 相关接口外，库还提供 setPreferredConnectionParams() 与 setMTU()，
          这两项是 tech_stack.coexistence 里调节 BLE/WiFi 共存权衡的直接抓手。
          编写固件时不要跳过它们。

    coex_and_stack:
      - name: "ESP-IDF RF Coexistence 指南 (ESP32-S3)"
        url: "https://docs.espressif.com/projects/esp-idf/en/release-v5.0/esp32s3/api-guides/coexist.html"
        usage: "WiFi + BLE 共存的权威依据：单射频时分复用、共存矩阵、周期与时隙划分、任务绑核建议"
        key_fact: "Wi-Fi Connected + BLE Connected 标注为 Y（性能稳定），共存周期内各占约 50% 时隙"
