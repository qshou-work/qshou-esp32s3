# ------------------------------------------------------------
# 风险登记 —— v1.4 起改为「按主题相邻」排列（同源风险放在一起便于复盘），
# 风险等级改由每条 level 字段显式标注。每条都要有触发条件与兜底。
# ------------------------------------------------------------
risk_register:
  - id: "R1"
    risk: "Y71t / Android 11 不接受第三方 BLE 绝对坐标报告"
    level: "MEDIUM（原 HIGH，2026-09-28 下调）"
    trigger: "M2 兼容性冒烟"
    why_downgraded: >
      桌面调研已闭环：绝对坐标在 Android 上可行，前提是走 Digitizer 触摸屏描述符。
      剩余不确定性只剩「OriginOS 1.0 这一具体 ROM 的实现」，且已有成熟库在同类场景中落地，
      故从「方向可能不成立」降级为「具体机型需验」。
    mitigation: "使用 Autfy/ESP32-BLE-HID 的 digitizer 描述符；按 coordinate_mode.verification_checklist 逐条验"
    fallback: "仅在触摸屏描述符确认无效时，才回退 relative + 归零"
    status: "OPEN（待真机冒烟）"

  - id: "R2"
    risk: "长期插电导致电池鼓包 / 屏幕常亮导致 AMOLED 烧屏"
    level: "HIGH"
    trigger: "7×24 运行后逐渐显现，不可逆"
    refined_view: >
      v1.4 起把主因从"循环次数"改判为"满电停留 × 温度"：
      每天的放电吞吐量由功耗决定，浅循环换不来更多总吞吐；真正可优化的是长期停在哪个 SOC 区间。
      据此重新设计了 Tier-A 方案。
    mitigation: >
      默认 Tier A：保留原电池 + 5V/1A 慢充 + 本地定时的智能插座，把 SOC 压在 45-65%；
      详见 android_prep.long_term_power.tier_a（含"为什么必须用慢充"这一关键工程细节）。
    why_keep_battery: >
      保留电池的核心理由是断电容错：旁路供电下一次供电闪断就等于现场要有人去按电源键，
      这对异地无人值守是更糟的失效模式。详见 android_prep.long_term_power.strategy_decision.decisive_argument。
    fallback: "降低在线时长，改为按需上电；拆电池走旁路仅在能接受『断电需人工开机』时才考虑"
    status: "OPEN（策略已定，待实测标定放电速率与温升）"

  - id: "R3"
    risk: "摄像头/手机位移导致标定矩阵 H 失效"
    level: "HIGH"
    trigger: "磕碰、万向臂蠕变、打扫卫生"
    mitigation: "刚性固定 + 扎带锁死；UI 提供一键标定自检"
    fallback: "重新走 9 点标定流程"
    status: "OPEN"

  - id: "R4"
    risk: "OriginOS 后台策略杀死 BLE 连接或触发省电断连"
    level: "LOW（原 MEDIUM，2026-09-28 下调）"
    trigger: "锁屏后或空闲一段时间后"
    why_downgraded: >
      Q4 已结案：HOGP 走 Android 系统蓝牙栈而非 App 持有的 GATT 连接，
      Doze / App Standby / 前台服务等后台限制不适用于本场景；
      且 BLE 控制器有独立供电域，主机休眠时仍能维持连接。
      这不是"策略可能杀连接"，只剩 OEM 激进省电这一种小概率路径。
    residual_uncertainty: >
      真正未定的改成了另一件事：息屏后 HID 触控能否把屏幕唤醒。
      它不导致断连，但决定"能否用息屏来实现烧屏缓解"，因此在 Q4 验证项里单独跟踪。
    mitigation: "蓝牙加入电池优化白名单（低成本保险）；默认常亮，不依赖息屏唤醒"
    fallback: "若息屏后无法唤醒，则放弃息屏策略，改用降亮度 + 壁纸轮换处理烧屏"
    status: "OPEN（待息屏 30 分钟单项验证）"

  - id: "R5"
    risk: "WiFi 与 BLE 共用 2.4GHz 射频，图传与 HID 报告互相抢占"
    level: "MEDIUM"
    trigger: "持续高帧率推流叠加高频点击"
    refined_view: >
      Q3 已结案其"可行性"：官方共存矩阵把 Wi-Fi Connected + BLE Connected 标为 Y，
      共存周期内各占约 50% 时隙。所以本条不再是"会不会冲突"，而是"两边够不够用"。
    mitigation: >
      按 tech_stack.coexistence.tuning_knobs 调：任务分核、用 setPreferredConnectionParams 定点、
      注意 PSRAM 带宽竞争（这条比射频更容易成为真瓶颈）。
      兜底走 degradation_path，其中"发 HID 时短暂抑制取帧"的性价比最高。
    acceptance_required: "必须跑满 1 小时混合负载压测并按四项量化指标判定，不能只验证没断连"
    fallback: "降 fps/画质优先于牺牲输入；保留图传优先级可配置"
    status: "OPEN（待 1 小时混合压测）"

  - id: "R12"
    risk: "镜头出厂合焦点远于工作距离，画面全程发虚"
    level: "HIGH"
    trigger: "首次安装 —— 这是最容易被误判为『摄像头坏了/驱动不对』的坑"
    why_high: >
      它的隐蔽性在于：画质糊会被优先归因为分辨率选错、驱动配置不对，
      于是反复折腾参数而不是去旋转镜头座。实际上标配定焦模块的出厂合焦点通常远于 15cm，
      不手动调焦必然糊。
    mitigation: "严格按 hardware.optics.focus_procedure 执行，且必须在距离锁定之后才调焦"
    detection: "判定别用肉眼，用 Pointer location 十字线或标定图最小线宽的锐利度"
    fallback: "换带调焦环的广角模块（同时按 Q7 距离表重新算工作距离）"
    status: "OPEN"

  - id: "R13"
    risk: "径向畸变无法被单应矩阵吸收，导致边缘标定残留系统性误差"
    level: "MEDIUM"
    trigger: "标定通过进入实际使用后，四角区域落点偏"
    why_this_was_wrong_before: >
      v1.1-v1.3 曾写"畸变由 calibration 吸收"，数学上不成立：
      H 只描述平面到平面的射影变换，径向畸变是非线性非射影畸变。
      仅用 9 点去拟合 H，会把畸变摊成平均残差，表现为中心准、边缘偏。
    mitigation: "标定阶段先 calibrateCamera 求畸变系数做 undistort，再 fit H；标定点增至 ≥16 点"
    detection: "用留一残差法看残差是否随离中心距离单调增大 —— 若是，即为畸变未被建模"
    fallback: "若不想引入 OpenCV 完整标定，则把可操作区限制在屏幕中央区域，边缘标为不可点区"
    status: "OPEN"

  - id: "R6"
    risk: "ESP32-S3 长期满载高温降频甚至死机"
    level: "MEDIUM"
    trigger: "夏季环境或散热不良"
    mitigation: "散热片 + 降频阶梯 + 任务看门狗"
    fallback: "降分辨率保运行"
    status: "OPEN"

  - id: "R7"
    risk: "Pinout 与板卡不符导致摄像头无输出或损坏"
    level: "MEDIUM"
    trigger: "接线/首次上电"
    mitigation: "逐脚核对原理图；上电前万用表确认 VCC 电平"
    fallback: "换一块符合规格的板卡，或按实际原理图改 Pinout"
    status: "OPEN"

  - id: "R8"
    risk: "Tailscale 无法 P2P 打洞，走 DER 中继导致延迟显著上升"
    level: "MEDIUM"
    trigger: "对称型 NAT / 运营商限制"
    note: >
      注意 Q6 的结论：无论能不能打洞，subnet router 都是必需的——
      它解决的是"ESP32 无法安装客户端"的问题，与 NAT 穿透是两个维度。
      不要误以为部署了 subnet router 就不会走中继。
    mitigation: "用 tailscale netcheck / ping 确认是否落在中继上；对称 NAT 场景下无法根除，只能量化其代价"
    fallback: "接受高延迟，仅用于非实时操作；relay 路径要按 network.bandwidth_headroom 留 2 倍余量"
    status: "OPEN"

  - id: "R14"
    risk: "subnet router 的 Tailscale 节点密钥过期，远程访问静默失效"
    level: "MEDIUM"
    trigger: "部署数月后某一天"
    why_nasty: >
      节点掉出 tailnet 后，现场设备一切正常（ESP32 还在跑、画面还能在本地看），
      只有远程进不去。排障时很容易把时间花在怀疑 ESP32 或 WiFi 上。
    mitigation: "对 subnet router 关闭 key expiry（或改用 tag，tag 默认禁用过期）；写入部署检查清单"
    detection: "控制端 health 面板保留『能否 ping 通 router 的 100.x 地址』分支，用于区分是 router 掉线还是 ESP32 掉线"
    fallback: "重新认证一次即可恢复（tailscale up）；关键是别把它误诊为硬件故障"
    status: "OPEN"

  - id: "R15"
    risk: "智能插座成为新的单点故障 / 依赖云端导致定时失效"
    level: "MEDIUM"
    trigger: "插座掉线、家庭 WiFi 变更、云平台故障"
    why: >
      Tier-A 供电策略依赖插座定时。若插座是纯云端调度型，断外网后不执行 schedule，
      手机会一路放电到关机——而他又不在现场。
    mitigation: "选本地执行定时的插座型号；插座 SSID/密码变更窗口要避开无人期"
    detection: "把『电池长期低于 40%』作为控制端可观测项（相机本身就是 SOC 读数手段）"
    fallback: "本地定时的简易时控开关（纯硬件，无云依赖）是更保守的选择"
    status: "OPEN"

  - id: "R16"
    risk: "官方 broker 成为全局单点故障，且视频流带来持续流量成本"
    level: "HIGH（v1.6 上调：运营责任由项目方承担）"
    trigger: "v1.5 默认路径改为 outbound_relay 后立即成立；v1.6 定为项目方托管后影响面扩大"
    why: >
      单点故障从"家里一台常开节点"换成"一个中心 broker"，影响面反而变大：
      broker 挂掉 = 全部用户同时失联，而不是单站点失联。
      v1.6 后这个故障不再由用户自己承担，而是由项目方承担 —— 故障即项目信誉损失。
      同时画面流经过 broker，按 broker_service.economics 的估算，成本随用户数线性增长。
    mitigation: >
      broker 需可观测（健康检查与告警）并支持水平扩展；
      按 broker_service.architecture_refinement 把 broker 收敛为"信令 + 中继兜底"，
      让 P2P 承担主要流量；严格执行按需拉流，禁止 24h 常推；
      成本侧设免费额度与限流，见 broker_service.economics.mitigations。
    detection: "控制端 health 面板区分『broker 不可达』与『设备不可达』两个分支"
    fallback: "视频回落按需抓单帧；用户可随时迁移到自托管实例（p2_self_host_first_class 是这条兜底的前提）"
    status: "OPEN（设计阶段；待定 SLA 与停服预案）"

  - id: "R19"
    risk: "官方 broker 的运营可持续性与合规负担"
    level: "HIGH"
    trigger: "服务正式对外开放、用户规模增长、或监管问询时"
    why: >
      带宽是随用户数线性增长且无法靠优化消除的成本（broker_service.economics 已量化：
      1000 日活约 26 TB/月）。叠加中国境内的 ICP 备案义务与《个人信息保护法》
      对"手机屏幕内容"这一类个人信息的处理要求，运营成本与法律风险都不低。
      这类风险的特点是不爆发则已，爆发即服务下线。
    mitigation: >
      先定商业模式与免费额度，再开放注册；境内运营必须先解决备案；
      隐私政策明确告知留存期限与删除机制；日志不得留存可识别内容。
    fallback: >
      缩小官方实例的承诺范围（例如只做信令不做中继），
      把大规模与合规敏感用户导向自托管或企业私有部署。
    status: "OPEN（待商业模式与地域决策）"

  - id: "R20"
    risk: "broker 运营方可读取全部画面流 —— 集中信任风险"
    level: "HIGH"
    trigger: "项目方运营 broker 之日起即存在，无需外部攻击"
    why: >
      这是"项目方提供 broker"区别于"用户自建 broker"的关键新增风险：
      用户自建时运营方就是用户自己，而项目方托管后，
      项目方在技术上获得了读取所有用户手机屏幕、控制所有设备的能力。
      对开源项目而言，这既是实质风险，也是社区信任问题 ——
      一旦被质疑，解释成本远高于提前做加密。
    mitigation: >
      端到端加密（broker_service.three_preconditions.p1_e2e_encryption）：
      密钥带外交换、broker 只转发密文、永不落明文。
      并把"broker 看不到明文"写进安全白皮书，作为对外可验证的承诺。
    verification: "需提供可验证手段（如开源客户端 + 抓包自检指引），让用户能自行确认 broker 收到的是密文"
    fallback: "若 E2E 在工程上无法落地，则应重新考虑是否由项目方托管 —— 这一条是硬前提"
    status: "OPEN（MVP 阶段就应实施，不可延后）"

  - id: "R21"
    risk: "IPv4 打洞在家宽 CGNAT 下成功率不确定，中继占比可能远高于预期"
    level: "HIGH"
    trigger: "真实网络环境下首次大规模接入"
    why: >
      P2P 优先的收益（带宽成本下降）完全建立在"打洞能成功"这个假设上。
      但中国家庭宽带 IPv4 相当比例处于运营商级 NAT 之下，对称 NAT 会直接导致打洞失败。
      若实际中继占比过高，则 broker_service.economics 的成本模型失效，
      项目方将承担远超预期的带宽支出 —— 而这个偏差在服务开放后才暴露，届时已不可逆。
    mitigation: >
      把 IPv6 直连放在打洞之前（IPv6 无 NAT，才是稳定的零中继路径）；
      成本规划按"部分用户走中继"建模并保留余量；
      上线前做真实家宽 / 4G 环境的打洞成功率专项测量。
    detection: "broker 侧统计并上报『P2P 成功率 / 中继占比 / 平均中继时长』三项指标"
    fallback: "若中继占比过高，收紧免费额度并优先把大流量用户导向自托管或企业私有部署"
    status: "PARKED（v1.8）—— 该风险只在 P2P 启用后才成立，随 P2P 一并推迟"
    v1_8_note: >
      此前提出的「真实网络环境打洞成功率专项测量」已明确叫停：在链路尚未跑通时
      测量一条不存在的路径没有意义。触发条件见 execution_policy.re_evaluate_trigger。

  - id: "R22"
    risk: "P2P 改走 UDP 后，MJPEG 分片丢包导致整帧报废、有效帧率下降"
    level: "MEDIUM"
    trigger: "P2P 视频通道启用后"
    why: >
      VGA 单帧 JPEG 常达 20-60 KB，需分成数十个 UDP 分片；
      JPEG 不可部分解码，丢任意一个分片整帧作废。
      单帧越大，整帧存活率越低（40 KB / 0.5% 丢包下约 85%）。
      表现为"画面帧率明显低于配置值"，易被误诊为摄像头或 WiFi 问题。
    mitigation: >
      分片对齐 MTU（约 1200 字节）；P2P 路径下主动压低单帧大小；
      带 seq 与帧号，缺片即整帧丢弃不做重传（重传对实时视频无意义）。
      详见 broker_service.transport_architecture.udp_fragmentation。
    why_acceptable: "MJPEG 每帧独立、无帧间依赖，丢帧只降帧率，不会花屏或累积错误"
    detection: "健康面板上报『发送帧率 / 有效帧率 / 整帧丢弃率』，三者必须分开统计"
    fallback: "丢帧率过高时自动降画质或降 fps；极端情况回落 broker 中继（TCP 可靠）"
    status: "PARKED（v1.8）—— MVP 走 TCP/WebSocket 全量中转，不存在 UDP 分片问题"
    v1_8_note: "随 P2P 一并推迟；跑通后若启用 P2P 视频通道则本条自动复活"

  - id: "R17"
    risk: "大规模部署所需的配网 / 身份 / OTA 能力在 MVP 设计中缺失"
    level: "HIGH"
    trigger: "目标变更为大规模部署"
    why: >
      MVP 的三处设计在单台时可行、多台时不可行：手动配网、共用静态 token 且串口人工录入、
      禁用 OTA 走串口烧录。这三项不补齐，规模化在运维上不具备可行性，
      且它们的工作量远大于网络层改造本身。
    mitigation: "按 scalability.deployment_at_scale_requirements 逐项补齐，并把配网与身份安全列为 M1 之前的门禁"
    fallback: "小批量部署时可暂缓 OTA，但配网与每设备唯一凭据不可省略"
    status: "OPEN（目标变更的连带工作量，尚未排入 milestones）"

  - id: "R18"
    risk: "开源分发的依赖许可证风险与上游库硬依赖"
    level: "MEDIUM"
    trigger: "仓库公开、引入外部贡献者或打包分发时"
    why: >
      tech_stack.libraries 中的第三方依赖（含 Autfy/ESP32-BLE-HID）许可证尚未清点，
      且核心 HID 描述符能力目前依赖单一上游库 —— 这与已删库的先例（asterics，404）叠加，
      对开源项目是实质性风险。
    mitigation: >
      分发前完成依赖许可证清点并确认兼容；fork 并锁定版本（R1 已有此要求）；
      把 Report Descriptor 规格完整固化在本文件内，使其可在脱离上游库的情况下自行实现。
    fallback: "若许可证不兼容，则自实现 HID 描述符与报告封装层（规格已在本文件内，工作量可控）"
    status: "OPEN（待许可证清点）"

  - id: "R9"
    risk: "安装距离不当导致画面装不下整屏"
    level: "LOW（设计已闭合，风险转为执行偏差）"
    trigger: "首次安装取景"
    resolved_by: >
      Q7 已用几何算清：早期写的 8cm 是错的（只覆盖约 56% 长边），正确的推荐值是 13-16cm，
      取决于买到的具体镜头。详见 hardware.optics.distance_table 与 recommended_working_point。
    mitigation: >
      按 hardware.optics.measure_procedure 用屏幕当标尺现场反推实际视场，
      不要依赖供应商标称值；算出 d_min 后取 1.05-1.10 倍再锁机构。
    fallback: "若空间受限装不下 13cm，则更换更广角的镜头模块（代价是径向畸变加重，见 R13）"
    status: "OPEN（待取景验证）"

  - id: "R10"
    risk: "手机无响应/黑屏时完全失去控制手段"
    level: "LOW"
    trigger: "App 卡死、系统假死"
    mitigation: "当前只能物理接触"
    fallback: "v2.0 增加 GPIO → 继电器/FingerBot 物理按键（已在 extensibility 预留）"
    status: "ACCEPTED"

  - id: "R11"
    risk: "核心依赖 Autfy/ESP32-BLE-HID 为单人维护项目，可能停更或引入破坏性变更"
    level: "MEDIUM"
    trigger: "库更新、作者删库（已有先例：asterics/ESP32-BLE-HID 现已 404）"
    mitigation: "fork 到自己的仓库并锁定 commit；保留 descriptor 规格在本文件内，脱离库也能自行实现"
    fallback: "按 coordinate_mode.correct_descriptor_spec 自行实现 5 字节触控报告"
    why_this_matters: >
      v1.1 规划时选定的 asterics/ESP32-BLE-HID 今天已经 404，
      说明「引用第三方库链接」本身就是一种技术债。描述符规格必须写在规格文件里而非只留链接。
    status: "OPEN"

# ------------------------------------------------------------
# 里程碑 —— 每个 gate 有明确的出口条件，不满足不推进
# gate 的意义：有些错误越晚发现和修正成本越高，必须在推进前结清
# ------------------------------------------------------------
milestones:
  - id: "M0"
    name: "环境就绪"
    exit_criteria:
      - "Arduino-ESP32 环境可编译烧录"
      - "按 hardware.pinout 接线后 CameraWebServer 能出流"
      - "Y71t 完成 android_prep 全部必做项"

  - id: "M1"
    name: "看得见，且看得稳"
    gate: "新增：光学几何与合焦（Q7 出口）"
    exit_criteria:
      - "按 hardware.optics.measure_procedure 反推实际视场，确认整屏入画且余量 5-10%"
      - "按 hardware.optics.focus_procedure 完成调焦，十字线/标定图最小线宽可清晰分辨"
      - "VGA@15fps 连续 30 分钟无花屏、无丢帧"
      - "物理安装已锁定（含轴向距离），标定前置条件满足"
      - "GET /api/v1/health 可返回完整字段"

  - id: "M2"
    name: "发得出去（触控通路打通）"
    gate: "冒烟 A"
    exit_criteria:
      - "tap / swipe / HOME / BACK 四类指令均能被 Y71t 稳定响应"
      - "键盘与绝对触控在同一 BLE 连接中共存"
      - "BLE HID 与 WiFi 图传同时工作不断连"
      - "跑满 tech_stack.coexistence.acceptance_test 的 1 小时混合压测，四项指标达标"
      - "若出现「改了描述符没反应」，确认已删除旧配对并重连"
      - "open_questions.Q1 真机侧闭合"

  - id: "M3"
    name: "点得准（标定闭环）"
    gate: "门禁 B"
    exit_criteria:
      - "按 coordinate_mapping.calibration 的留一残差检验通过，且确认残差不随离中心距离单调增大（否则命中 R13 径向畸变）"
      - "coordinate_mapping.acceptance 三项指标全部达标"
      - "息屏 30 分钟的 Q4 验证项完成，结论回写 android_prep.bluetooth"
      - "app 可用区域已由 dumpsys 回填"

  - id: "M4"
    name: "远程可用"
    v1_5_note: >
      目标变更后本里程碑的验收对象改变：默认路径由 subnet router（lan_direct）
      改为 outbound_relay（设备主动出站到 broker）。下列首条已按新路径改写，
      原 subnet router 验收项降级为 lan_direct 后端的可选检查。
    exit_criteria:
      - "默认后端 outbound_relay 打通：设备零现场配置即可注册上线，异地控制端可取流与下发指令"
      - "控制端能区分『broker 不可达』与『设备不可达』两种失败（R16 的可观测要求）"
      - "每设备唯一凭据已生效，禁止共用 token；broker 侧按 device_id 做访问隔离"
      - "（可选后端）若走 lan_direct，则 subnet router 已就绪且已关闭 key expiry"
      - "UC1~UC4 全部通过，UC5 连续 1 小时无失联"
      - "security.mvp_minimum 四条均已落地"
      - "供电 Tier-A 窗口已按实测标定，SOC 稳定在目标区间且机身无明显温升"
      - "72h soak test 通过"

# ------------------------------------------------------------
mvp:
  step_1: "ESP32-S3 烧录 CameraWebServer 例程，浏览器看 MJPEG 流"
  step_2: "实测 Y71t 屏幕真实分辨率，回填 target_device.screen_resolution.nominal"
  step_3: "完成 android_prep 全部必做项，避免后续反复返工"
  step_4: "整合 BLE HID，ESP32 广播 BLE HID，Y71t 配对"
  step_5: "【门禁】坐标模式决策：验证 absolute 是否可用，收口 relative/absolute"
  step_6: "【门禁】9 点标定求 H 矩阵，残差校验通过并持久化"
  step_7: "Win10 浏览器页面显示摄像头画面 + 点击按钮（集成换算模块）"
  step_8: "点击画面任意位置 → CAP→SCR→HID 换算 → BLE 下发 → Y71t 正确响应"
  step_9: "跑通 UC1~UC4，脚本化并落盘证据"
  step_10: "Tailscale 配置完成，异地 Win10 能看屏+点击"
  step_11: "UC5 稳定性验证 + 72h soak test"
  acceptance: "异地浏览器能看 Y71t 屏幕画面；点击画面任意位置能让 Y71t 在同一位置执行操作（落点误差满足 coordinate_mapping.acceptance）；连续运行 72 小时无需人工干预"

# ------------------------------------------------------------
implementation_order:
  step_1: "下单 bom.required + bom.recommended，到货核对 board 型号与 PSRAM 容量"
  step_2: "核对原理图确认 hardware.pinout，万用表确认 VCC 电平后再上电"
  step_3: "Arduino-ESP32 环境搭建 → 跑 CameraWebServer → 浏览器看流（M0）"
  step_4: "【冒烟 A】用 Autfy/ESP32-BLE-HID 的 Digitizer 触摸屏描述符做兼容性冒烟：一次 tap + 一次 swipe + 一次 HOME/BACK，并验证 BLE 与 WiFi 图传共存不再断连（不再是选型决策，选型已于 v1.3 收口）"
  step_5: "集成选定的 BLE HID 库 → Y71t 配对 → 发 Home/Back 验证基础通路（M2）"
  step_6: >
    【光学工位，顺序不可颠倒】
    (a) 摄像头旋转 90° 竖置；
    (b) 按 hardware.optics.measure_procedure 用屏幕当标尺反推实际视场，算出 d_min 后取 1.05-1.10 倍定距（预期 13-16cm，不是 8cm）；
    (c) 距离锁死后再按 focus_procedure 调焦；
    (d) 最后锁定全部关节（含轴向）
  step_6b: >
    【供电工位】改用 5V/1A 充电器（禁用 44W 闪充）；
    实测屏幕常亮下的放电速率，据此设智能插座补电窗口，目标 SOC 区间 45-65%
  step_7: "【门禁 B】标定链路: 标定图全屏 → 9 点采集 → 求 H → 残差校验 → 持久化 → 重投影自检（M3）"
  step_8: "换算模块落地: Win10 侧实现 CAP→SCR→HID，单元测试覆盖已知映射用例"
  step_9: "ESP32 内置 HTTP API: /api/v1/tap /api/v1/swipe /api/v1/key 接收 JSON 指令并加 token 鉴权"
  step_8b: >
    【v1.5 新增，必须早于 step_9】传输层抽象落地：定义 connect / send_command /
    stream_frames / report_endpoint 四个接口。MVP（见 execution_policy.mvp_transport_decision）
    仅实现 outbound_relay 一个后端（控制端经 broker 中转，视频+指令都走 TCP/WebSocket），
    但接口与后端选择逻辑要先立住 —— 否则 step_9 之后的改造都是重构
  step_10: "ESP32 内置 WebSocket: /api/v1/stream 推 JPEG 帧"
  step_11: "Win10 浏览器 UI: canvas 显示视频 + 虚拟按钮面板 + 标定模式 + 健康面板"
  step_12: "可靠性加固: 看门狗 / 重连 / 降级阶梯 / /api/v1/health"
  step_13: "Python 自动化脚本: UC1~UC5 + 坐标链路断言 + 证据落盘"
  step_14: >
    【v1.5 改写】远程接入: 落地 outbound_relay 后端（设备主动出站注册 → broker 侧按 device_id
    隔离 → 控制端经 broker 取流与下发）→ 补齐每设备唯一凭据 → 验证零现场配置上线（M4）。
    原 Tailscale/subnet router 流程降级为 lan_direct 后端的可选部署指南，不再作为默认路径。
  step_15: "72h soak test → 复盘 heap/uptime/reset_reason 曲线"

  blocking_dependencies:
    step_5_depends_on: "step_4（选错库会导致输入层重写）"
    step_7_depends_on: "step_6（安装未锁定、或未调焦清晰时，标定无意义）"
    step_6_depends_on: "step_3（先能出流，才谈得上测量视场与调焦）"
    step_8_depends_on: "step_7（没有 H 矩阵就没有可用的真实 SCR 坐标）"
    step_13_depends_on: "step_8（自动化断言依赖换算模块）"
    step_15_depends_on: "step_12（没有健康数据就无法定位 soak 失败原因）"

# ------------------------------------------------------------
# 命名约定 —— 让后续 AI / 脚本保持一致
# ------------------------------------------------------------
naming_conventions:
  rationale: "跨会话协作时，命名不一致是隐性返工的主要来源"

  device_id: "小写短横线，如 y71t-01；写入 NVS 并用于标定 profile 分目录"
  api:
    base: "/api/v1"
    style: "名词或动词短语，小写短横线"
    payload: "JSON，snake_case"
    auth: "Header: X-Auth-Token"
  coord_fields:
    camera_pixel: "cap_x / cap_y"
    screen_pixel: "scr_x / scr_y"
    hid_logical: "hid_x / hid_y"
    rule: "坐标字段必须带坐标系前缀，禁止裸写 x / y"
  units: "时间一律 ms；坐标单位在字段名后缀已隐含，值里不带单位"
  log_prefix: "[CAM] / [BLE] / [HTTP] / [CAL] / [WDG]"
  git:
    branch: "feat/ fix/ chore/ doc/"
    commit: "Conventional Commits，如 feat(calibration): add homography solver"
  versioning: "SemVer；规格文件本身的 version 与固件版本独立演进"

# ------------------------------------------------------------
open_questions:
  - id: "Q1"
    question: "Y71t / Android 11 是否接受第三方 BLE 绝对坐标 (HID Touch) 报告？"
    status: "RESOLVED (desk) — 待真机冒烟确认"
    answer: >
      接受，但必须是 Digitizer / Touch Screen（Usage Page 0x0D + Usage 0x04）描述符，
      而不是「鼠标描述符 + Absolute 标志位」。后者在 Android 上不可靠，是社区里
      「绝对鼠标点不动」的真实根因。已落实到 10000 逻辑范围、Report ID 0x01、
      5 字节报告、state=0x03/0x00 的具体规格，见 input.ble_hid.coordinate_mode.resolved_answer。
    evidence:
      - "sobrinho/ESP32-BLE-Abs-Mouse：实装 digitizer 描述符，README 标注兼容 Android"
      - "Autfy/ESP32-BLE-HID：文档直接写明 Android 将 0~10000 逻辑坐标映射到屏幕"
      - "反面旁证：kshoji BLE-HID-Peripheral 的兼容矩阵中，绝对鼠标仅 macOS 验证通过"
    remaining_action: "M2 阶段做一次 tap/swipe 冒烟即可闭合"
    blocks: "不再阻塞；原卡点 milestones.M2 已降级为冒烟"

  - id: "Q2"
    question: "Y71t 屏幕真实分辨率为多少（是否被状态栏/导航栏占用）？"
    status: "RESOLVED — 面板分辨率已确认"
    answer: >
      1080 × 2400，20:9，6.44 英寸 AMOLED，60Hz，约 409ppi。
      来源 vivo 官方规格参数页，与 GSMArena / 百度百科口径一致。
      剩余唯一未定项是应用可用区域高度（状态栏占用），属可测量项而非未知项。
    evidence: "https://www.vivo.com.cn/vivo/param/y71t"
    remaining_action: "真机到手用 adb shell dumpsys window displays 读 app 矩形并回填"
    blocks: "不再阻塞任何步骤"
  - id: "Q3"
    question: "Autfy/ESP32-BLE-HID（BLE HID）能否与 esp32-camera + WiFi 图传在同一 Arduino-ESP32 工程中共存？"
    status: "RESOLVED (desk) — 原理成立；剩余为稳态 QoS 实测量化"
    answer: >
      能共存，且不是勉强可行：ESP32-S3 只有一套 2.4GHz 射频，WiFi 与 BLE 走时分复用，
      Espressif 官方共存矩阵把「Wi-Fi STA Connected + BLE Connected」标注为 Y（性能稳定），
      并写明该方案下共存周期内两者各占约 50% 时隙。
      因此问题从「会不会冲突」降级为「一半资源够不够用」。
      真正的隐患常被误判：除了射频时隙，PSRAM 与总线带宽是另一条竞争线
      （camera frame buffer 走 DMA 占 PSRAM，WiFi TX buffer 也要带宽），
      它比射频更容易成为实际瓶颈。
    resolved_into: "tech_stack.coexistence（含 tuning_knobs / acceptance_test / degradation_path 三级方案）"
    key_actions:
      - "任务绑核：WiFi 与 BT controller/host 分到不同 CPU 核"
      - "用库自带的 setPreferredConnectionParams / setMTU 定点调节，不要沿用默认值"
      - "不要在这类共存场景下反复启停 BLE 广播（最典型的疑难杂症来源）"
    blocks: "不阻塞 M2；M2 的出口条件改为跑满 1 小时混合压测并按四项量化指标判定"
    remaining_action: "执行 tech_stack.coexistence.acceptance_test（1 小时混合负载），并把结果回写到该章节"

  - id: "Q4"
    question: "息屏状态下 Y71t 是否保持 BLE HID 连接？"
    status: "RESOLVED (desk) — 会保持；另有一项新问题被识别出来"
    answer: >
      保持。理由是分清楚两个层次：BLE 物理连接由独立供电域的蓝牙控制器维持
      （主机休眠时它仍能保活并在需要时唤醒主机，与耳机/手表息屏不断连是同一机制）；
      HOGP 输入由 Android 系统蓝牙栈处理，不是 App 持有的 GATT 连接。
      开发者文档里那套 Doze / App Standby / 前台服务限制约束的是 App 进程发起的 BLE 操作，
      对本场景不适用——这一点是最容易被误读的地方。
    newly_identified: >
      真正未定的问题被替换成了：息屏后 HID 触控能否把屏幕唤醒。
      它不影响连接，但决定"能否靠息屏来缓解烧屏"，所以单独跟踪。
    resolved_into: "android_prep.bluetooth.screen_off_behavior"
    blocks: "不阻塞；android_prep 默认维持常亮，息屏仅作为可选降级"
    remaining_action: "息屏 30 分钟后发一次 tap，记录三件事：连接是否还在 / 屏幕是否被唤醒 / tap 是否生效"

  - id: "Q5"
    question: "Y71t 是否支持旁路供电（绕过电池直接给主板供电）？"
    status: "RESOLVED — 官方不支持（未见任何说明），据此定 Tier-A 为默认策略"
    answer: >
      官方参数页只有电池容量与闪充规格，对旁路供电没有任何承诺 → 按不支持处理。
      社区/维修业的可行做法是「DC 稳压源或电池模拟器给 B+/B- 供电 + NTC 引脚接等效电阻」，
      且 NTC 阻值必须实测（公开先例中有的机型约 2.35kΩ，也有 20-30kΩ 的经验值），
      照抄必然返工。
    decision: >
      但本项目不采用旁路供电，决定性理由不是寿命而是失效模式：
      拆掉电池后任何一次供电闪断都会直接关机，而异地无人值守场景下关机
      意味着必须有人到现场按电源键。用一个确定的运维灾难去换不确定的电池寿命收益不划算。
    additional_correction: >
      顺带纠正了 v1.1-v1.3 的一处错误设想：「每 24h 断电一次让电池深循环」方向与化学常识相反。
      每天的放电吞吐量由功耗决定改不了，浅循环换不来更多总吞吐；
      真正可优化的是长期停留在哪个 SOC 区间（40-60% 应力最低）以及温度。
    resolved_into: "android_prep.long_term_power（Tier A / B / C 三层方案 + 为什么必须用慢充）"
    blocks: "不阻塞任何步骤"
    remaining_action: "实测一次屏幕常亮的放电速率，据此设定智能插座补电窗口"

  - id: "Q6"
    question: "Tailscale 侧如何接入 ESP32：旁路 subnet router 还是给 ESP32 可达路由？"
    status: "RESOLVED — 这不是二选一，唯一解就是 subnet router"
    answer: >
      ESP32 跑不了 Tailscale 客户端，而官方对「无法安装客户端的设备」（摄像头、
      老旧内核 NAS、打印机、交换机）给出的标准答案就是 subnet router：
      同网段一台常开的 Tailscale 节点代为通告路由。因此答案收敛为「必须有一台常开节点」，
      剩下的只是选谁来当这个节点（路由器跑 OpenWrt 最优，其次树莓派/NAS）。
    explicit_constraint: "Android 手机不能当 subnet router —— 其客户端不提供路由通告能力"
    gotchas_identified:
      - "--accept-routes 平台默认值不对称（Linux tailscaled 默认 false），典型症状是『手机能连、电脑连不上』"
      - "--snat-subnet-routes 默认 true 正是 ESP32 无需回程路由就能应答的原因，MVP 必须保持默认"
      - "节点密钥默认会过期，到期后静默掉线，表现为『部署几个月后某天突然连不上』"
    resolved_into: "network.esp32_access（含配置步骤、四个必踩坑、无常开节点时的兜底拓扑）"
    blocks: "不阻塞 M4，但需提前确认常开节点来源"
    remaining_action: "确认现网是否有可复用的常开节点；确定后立即关闭该节点的 key expiry"

  - id: "Q7"
    question: "8cm 距离下 OV2640 实际视野是否能完整覆盖 6.44 英寸屏幕？"
    status: "RESOLVED — 不能，8cm 是错的；正确值是 13-16cm"
    answer: >
      不能覆盖。屏幕显示区为 67.13 × 149.17mm（由 6.44 英寸 + 20:9 反推），
      OV2640 靶面 3.59 × 2.71mm。竖置 90° 时长边是约束边：
      标配 66° 镜头在 8cm 处只能装下约 56% 的屏幕长边，即近半个屏幕在画面外。
      完整覆盖所需最小距离：60°→16.2cm，66°→14.4cm，73°→12.6cm，90°→9.4cm，120°→5.4cm。
      取 5-10% 余量后，66° 推荐 15cm、73° 推荐 13cm、90° 推荐 10.5cm。
      早期文档里"必要时调整到 12cm"这个 fallback 同样不够（仅覆盖 83%）。
    correction_applied: "已改写 hardware.mounting.camera_distance，并新增 hardware.optics 章节"
    secondary_finding: >
      比视野更易踩的坑是**合焦距离**：标配定焦模块出厂合焦点通常远于本项目工作距离，
      不手动旋转镜头座调焦就一定是糊的，且极易被误判为摄像头或驱动故障（已登记为 R12）。
    unexpected_consequence: >
      景深比直觉浅得多（估算约 ±15-25mm），因此机构不仅要锁朝向，还要锁轴向距离。
      这也进一步强化了 R3 的刚性要求。
    resolved_into: "hardware.optics（几何推导、距离表、现场测量法、调焦步骤、景深）"
    blocks: "不阻塞；影响的是支架选型与首次安装"
    remaining_action: "到货后按 hardware.optics.measure_procedure 反推实际视场，反算距离后再锁机构调焦"

# ------------------------------------------------------------
# 工作目录规划 —— 工程启动时建立，支撑 pre_arrival_work 的接缝策略
# ------------------------------------------------------------
workspace_layout:
  root: "y71t-kvm-lite/"
  convention: "SemVer 与规格文件 version 独立演进；目录按职责切分，跨分区共享的契约放在 shared/"
  directories:
    - path: "shared/"
      purpose: "跨分区共享的机器可读契约：API schema、坐标换算常量、标定 profile schema、token 约定"
      contents:
        - "api_schema.yaml: 所有 /api/v1/* 请求/响应 JSON schema 与字段定义"
        - "coords.py / coords.h: CAP→SCR→HID 换算纯函数（无硬件依赖，唯一真源）"
        - "devices/<device_id>/calib.json: 标定结果（H 矩阵 + residual_offset + 残差）"
    - path: "broker/"
      purpose: "中转服务端（step_14）：设备注册、按 device_id 隔离、控制端取流与下发"
      contents:
        - "MVP 全量中转：WebSocket 图传 + HTTP API 转发，单后端实现（无需抽象层）"
        - "设备注册表、token 校验、session 路由、健康上报落盘"
    - path: "controller/"
      purpose: "Win10 控制端 UI（step_11）：canvas 显示视频 + 虚拟按钮 + 标定模式 + 健康面板"
      contents:
        - "index.html / app.js: 通过统一接口连 broker，视频源可替换为 mock"
        - "health_panel: 字段定义引用 controller.health_panel.fields"
    - path: "firmware/"
      purpose: "ESP32 固件（step_3~step_10）：CameraWebServer 改造、BLE HID、HTTP API、WebSocket 推流"
      contents:
        - "main/: 主循环、共存调优、看门狗"
        - "ble_hid/: Digitizer 描述符与 5 字节 report 打包（引用 shared/coords.*）"
        - "camera/: OV2640 采集与 MJPEG 编码"
    - path: "tools/"
      purpose: "离线工具与 mock：标定图生成、mock 视频源、合成 H 生成器"
      contents:
        - "mock_stream.py: 走与真实端点一致的 WebSocket 帧格式推送样例帧"
        - "gen_calib_grid.py: 生成全屏标定网格（android_prep 用）"
        - "fake_h.py: 给定已知 H 生成合成标定点（标定求解器自测用）"
    - path: "tests/"
      purpose: "Python 自动化断言（step_13）：UC1~UC5 + 坐标链路断言 + 证据落盘"
      contents:
        - "test_coords.py: 换算模块已知映射用例"
        - "test_calib.py: 用 fake_h 生成的合成点校验求解器精度"
        - "fixtures/ 软链或复制：合成 H、样例帧、标定图"
    - path: "fixtures/"
      purpose: "测试夹具：合成 H 矩阵、样例 JPEG 帧、标定图 PNG、已知映射用例"
    - path: "docs/"
      purpose: "与代码分离的文档：部署指南、README、架构图"

  seams:
    # 到货后只需替换以下三处，其余全部保留
    - id: "seam_video_source"
      mock_now: "tools/mock_stream.py 走与真实端点一致的 WebSocket URL 与 MJPEG 帧格式推送样例帧"
      replace_with: "firmware 的 /api/v1/stream 真实 MJPEG 流"
      constraint: "mock 必须走与真实端点一致的接口，否则 controller 层会重写"
    - id: "seam_h_matrix"
      mock_now: "tools/fake_h.py 生成的合成 H（已知单应矩阵，叠加可控噪声）"
      replace_with: "真机 9 点标定求得的 H 与 residual_offset"
      constraint: "仅替换数据，换算函数本身不依赖真实 H 即可开发与测试"
    - id: "seam_command_dispatch"
      mock_now: "换算结果打印到日志 / 写入落盘文件，不下发硬件"
      replace_with: "打包为 5 字节 BLE report 经 BLE HID 下发"
      constraint: "report 布局 [state][X_MSB][X_LSB][Y_MSB][Y_LSB]，state=0x03/0x00"

# ------------------------------------------------------------
# 到货前可前置工作清单 —— 实物未到手时即启动，最大化压缩到货后硬件接触时间
# ------------------------------------------------------------
pre_arrival_work:
  principle: >
    区分代码依赖与数据依赖：多数 step 看似依赖 ESP32，实际只依赖「真实 H 矩阵 / 真实视频流」
    这类数据；这些数据可先以 mock 替代，到货后仅替换三处接缝（见 workspace_layout.seams）。
  tiers:
    - id: "A"
