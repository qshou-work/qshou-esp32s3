  - version: "1.8.0"
    date: "2026-09-29"
    summary: >
      【执行策略】确立「跑通第一」为当前唯一优先级，并据此把 MVP 传输回退到最简形态。
      此前 v1.5-v1.7 连续三轮架构前瞻设计（可插拔传输 / P2P 优先 / 三级降级 / UDP 分片 /
      打洞成功率测算）本身成立，但会显著拉长首次跑通时间，
      且关键的打洞成功率在真网下本就测不准 —— 在跑通之前优化一条尚未存在的链路是本末倒置。
    changes:
      new_section: >
        新增顶层章节 execution_policy（顶层章节 27 → 28），固化四条内容：
        原则（跑通前不接受降低成本 / 降低开销 / 提高优雅度类方案）、
        理由（含对上述三轮前瞻设计的自我修正）、
        MVP 传输决策、以及重新评估的触发条件。
        同时在 project 下新增 current_priority 字段，使优先级在文件头部即可见。
      mvp_transport: >
        **MVP 传输明确为全量中转**：ESP32 主动出站连 broker，视频与指令都经 broker，
        走 TCP/WebSocket。完全复用现有 MVP 设计（WebSocket 图传 + HTTP API），
        改动最小、依赖最少、排障最直接。MVP 阶段只有少量测试设备，全量中转成本可忽略。
      parked: >
        五项目标挂起到跑通之后，架构结论保留、仅推迟实施：
        P2P 优先与三级降级、UDP 分片与整帧丢弃策略、打洞成功率与中继占比专项测量、
        带宽成本模型与免费额度设计、传输层多后端抽象的完整实现（只留接口 + 单一后端）。
        对应地把 broker_service.transport_architecture 标记为 PARKED，R21 / R22 状态改为 PARKED。
      guardrails: >
        区分「优化」与「开放前置条件」：前者可推迟，后者不可。
        E2E 加密（R20）、合规与运营可持续性（R19）、每设备唯一凭据这三项
        不阻塞跑通，但在官方 broker 承载真实用户之前必须完成。
        内测阶段可用 TLS + 每设备 token 过渡，但不得对外开放。
      trigger: >
        重新启用挂起项的条件：端到端链路稳定跑通，且出现 broker 带宽成本成为实际支出项 /
        用户数增长到中继占比有意义 / 中继路径下视频延迟不可接受 —— 三者任一。
    new_sections: "execution_policy（原则 / 理由 / MVP 传输决策 / 挂起项 / 前置护栏 / 重新评估触发）"
    status: "策略已确认并已写入规格；MVP 待按全量中转实施"

  - version: "1.7.0"
    date: "2026-09-29"
    summary: >
      确认并细化 v1.6 提出的传输架构：**broker 定位为「信令服务器 + 中继兜底」，
      数据流 P2P 优先**。本版把"方向"落成"可实施的设计"，并同时修正了一个
      过于乐观的预期 —— P2P 打洞在中国家宽 CGNAT 环境下并非必然成功。
    changes:
      traffic_split: >
        核心是按流量特性分流，而不是所有流量走同一条路：
        控制指令（几十字节、必须可靠）**始终走 broker** 的 TCP 长连接；
        视频（Mbps 级、可容忍丢帧）**优先 P2P**。
        指令小到带宽成本可忽略，用它换可靠性非常划算；视频才是成本主体。
      three_tier: >
        视频路径优先级：**IPv6 直连 › IPv4 UDP 打洞 › broker 中继**。
        把 IPv6 放在打洞之前是因为 IPv6 无 NAT，才是真正稳定的零中继路径。
      session_flow: >
        固化 6 步会话流程（设备出站注册 → 控制端取注册表 → broker 交换 endpoint →
        试 IPv6 → 试 IPv4 打洞 → 失败回落中继），并规定两条运维纪律：
        NAT 映射需定期 keepalive 维持；**路径选择必须由控制端显式上报，
        禁止设备静默切换**（否则"画面变卡"会被误诊为摄像头或 WiFi 问题）。
      udp_fragmentation: >
        量化了改走 UDP 的代价：VGA 单帧 20-60 KB 需分成数十片，
        JPEG 不可部分解码，**丢任意一片整帧报废**。单帧 15 KB / 0.5% 丢包下存活约 94%，
        40 KB 降至约 85% —— 单帧大小直接决定有效帧率。
        但 MJPEG 每帧独立、无帧间依赖，丢帧只降帧率不花屏，这正是 UDP 可接受的理由。
      honest_correction: >
        **修正了"带宽成本大幅下降"的乐观表述**：中国家庭宽带 IPv4 相当比例处于
        运营商级 NAT 之下，对称 NAT 会导致打洞失败。因此收益是有条件的，
        中继占比可能显著高于乐观估计，成本模型必须按"部分用户走中继"建模并保留余量。
        这一项无法靠桌面推算收敛，已列为真实网络环境的专项测量项。
    new_sections: "broker_service.transport_architecture（分流 / 三级降级 / 会话流程 / UDP 分片 / NAT 现实）"
    new_risks: >
      R21 打洞成功率不确定导致中继占比与成本偏离（HIGH）；
      R22 UDP 分片丢包导致整帧报废与有效帧率下降（MEDIUM）
    measurement_required: "真实家宽 / 4G 环境下的打洞成功率与中继占比统计 —— 该数据直接决定成本模型是否成立"
    status: "架构已确认；R21 需真网测量，R22 需实测标定"

  - version: "1.6.0"
    date: "2026-09-28"
    summary: >
      结清 v1.5 遗留的 broker 归属问题：**由项目方提供**（官方托管实例，用户开箱即用）。
      这一决定带来本项目迄今集中度最高的一项风险，因此本版的核心不是"怎么建 broker"，
      而是"如何在项目方运营 broker 的前提下仍然不辜负用户信任"。
    changes:
      decision: "broker 由项目方运营；定位为官方托管实例，用户无需自建"
      new_problem: >
        项目方从此在技术上可以读取所有用户的手机屏幕并向任意设备下发指令（R20）。
        用户自建时运营方就是用户自己，托管后这个主体变成了项目方 ——
        这是本决策引入的新问题，且它不是运维问题，是信任问题。
      reference_model: >
        采用 Matrix / Synapse 式结构：开源协议 + 开源服务器实现 + 官方托管实例 + 允许自托管。
        这样官方托管是便利而非锁定，也就不会重蹈本项目本来要反对的厂商云的覆辙。
      three_preconditions: >
        官方托管成立的三条硬前提：① 端到端加密，broker 只转发密文、永不解密；
        ② 自托管是一等公民，官方实例只是可选项（否则一旦停服所有设备变砖）；
        ③ 成本与合规可持续。缺任何一条都不如让用户自建。
      architecture_refinement: >
        把 broker 由"全量中转"细化为**信令服务器 + 中继兜底**（WebRTC 的 signaling + TURN 模型）：
        设备仍主动出站注册（保持零现场配置），但数据流优先 P2P，打洞失败才走 broker 中继。
        这一步同时收敛带宽成本与信任风险 —— 即便走中继，broker 拿到的仍是密文。
      e2e_encryption: >
        密钥带外交换（配网时由控制端生成 PSK，经 BLE provisioning 安全通道或扫码注入，
        禁止经 broker 传递密钥）；视频与指令统一 AEAD。
        ESP32-S3 有 AES/SHA/RSA/ECC 硬件加速，开销可接受但**必须实测**，
        需并入 coexistence 的 1 小时压测一并评估。
      economics: >
        量化了带宽成本：单设备约 0.9 GB/小时（2 Mbps、按需拉流）；
        1000 日活每天 1 小时 ≈ 26 TB/月 ≈ ¥1.3 万-2.6 万/月。
        这是随用户数线性增长且无法优化消除的成本，商业模式未定前不应承诺永久免费无限流量。
      compliance: >
        境内运营需 ICP 备案；屏幕内容属个人信息，触发《个人信息保护法》义务
        （告知、最小必要、留存期限与删除）。合规会反向约束架构，例如日志不得留存可识别内容。
    new_sections: "broker_service（托管模式 / 三条前提 / 架构细化 / 经济学 / 合规 / 对 public_exposure 的影响）"
    new_risks: "R19 运营可持续性与合规 / R20 broker 运营方集中信任（E2E 是其唯一缓解）"
    updated_risks: "R16 上调为 HIGH —— 故障责任由用户转移到项目方；新增 SLA 与停服预案要求"
    security_impact: >
      security 新增 threat_actors，按"主体能造成什么后果"而非"攻击手法"组织，
      明确列出 broker 运营方这一 v1.6 新增主体。
    status: "决策已定；E2E 加密需在 MVP 阶段实施不可延后；商业模式、地域与 SLA 仍为 open_items"

  - version: "1.5.0"
    date: "2026-09-28"
    summary: >
      【目标变更】项目目标由「自用 / 小规模」明确为「开源分发 / 大规模异地部署」。
      这是本项目迄今最大的一次方向性调整：MVP 的技术路线不变，
      但网络层默认路径、设备管理模型与若干 MVP 设计约束随之改变。
    changes:
      trilemma_settled: >
        在 scalability 的三难困境（零服务器 / 零公网暴露 / 部署友好，三者最多取二）中
        明确选择 B 边：**放弃「零服务器」，保住「零公网暴露 + 部署友好」**。
        理由是大规模部署的本质诉求是「一个中心管 N 个站点」，只有设备主动出站
        才能做到零现场配置且设备自身不暴露在公网。
      default_path_changed: >
        默认传输路径由 subnet router（lan_direct）改为设备主动出站（outbound_relay）。
        network.server_required 由 false 改为 conditional；public_exposure 仍保持 false。
        subnet router 降级为 lan_direct 后端下的一种实现，network.esp32_access 全节
        保留为该后端的部署指南，不再作为必选项。
      transport_abstraction: >
        确认传输层抽象为必须项，并规定其落地时机：implementation_order 新增 step_8b，
        **必须早于 step_9（HTTP API）**，否则后续全部改造都变成重构。
        抽象只暴露 connect / send_command / stream_frames / report_endpoint。
      scale_requirements: >
        新增 scalability.deployment_at_scale_requirements，指出目标变更后
        真正的瓶颈从"网络怎么打通"转移到"设备怎么管"：配网 / 每设备身份 / 设备注册表 /
        OTA / 标定平民化 / 板级适配 / 许可证共七项，其中前三项在 MVP 设计中不成立或明显不足。
      calibration_for_end_users: >
        提出一键自动标定方案：ESP32 提供全屏标定网格页面，用 Y71t 自带浏览器打开全屏显示，
        ESP32 拍一帧后自动检测网格交点求解 H。无需人工点 9 次，且不违反 non_goals
        （不装 App、不依赖 ADB）—— 这是开源分发 adoption 的关键门槛。
    new_risks: "R16 broker 单点故障与流量成本 / R17 大规模部署能力缺失（配网·身份·OTA） / R18 依赖许可证与上游硬依赖"
    milestone_impact: >
      M4 的验收对象改为 outbound_relay 零现场配置上线，并新增"区分 broker 不可达与设备不可达"
      与"每设备唯一凭据"两条；implementation_order.step_14 同步改写。
    open_sub_decision: >
      broker 由谁提供仍未定：用户自建（自托管，门槛高）vs 项目提供官方托管（开箱即用但中心化）。
      建议在项目 README 阶段之前定。
    status: "目标已定；大规模部署的六项能力尚未排入 milestones，需下一轮规划"

  - version: "1.4.0"
    date: "2026-09-28"
    summary: >
      结案 open_questions.Q3 / Q4 / Q5 / Q6 / Q7 —— 至此 Q1-Q7 全部完成桌面前置结案，
      剩余项为可程式化的真机验证，不再有阻塞性未知。
    changes:
      Q3: >
        BLE HID 与 WiFi 共存：官方共存矩阵把 Wi-Fi Connected + BLE Connected 标为 Y
        且各占约 50% 时隙，故风险从"能否共存"降级为"稳态 QoS"。
        新增 tech_stack.coexistence（tuning_knobs / acceptance_test / degradation_path），
        并指出真正的瓶颈可能是 PSRAM 带宽而非射频时隙。R5 细化，接受标准升级为 1 小时量化压测。
      Q4: >
        息屏不断连：HOGP 由系统蓝牙栈处理而非 App GATT，Doze/App Standby 不适用；
        BLE 控制器有独立供电域可保活。R4 由 MEDIUM 降 LOW。
        同时识别出替换问题——"息屏后 HID 触控能否唤醒屏幕"仍需真机验证。
      Q5: >
        官方无旁路供电承诺，按不支持处理，并给出 Tier A/B/C 三层方案。
        默认 Tier A（保留电池 + 5V/1A 慢充 + 智能插座窄 SOC 窗口），
        决定性理由是断电容错而非电池寿命。同时纠正了两个化学直觉错误
        （浅循环不等于总吞吐更高；满充停留才是主因）。新增 R15（智能插座单点故障）。
      Q6: >
        确认唯一解是同网段常开的 subnet router（非二选一），禁止用 Android 手机充当。
        补齐四个必踩坑：accept-routes 平台不对称、SNAT 必须保持默认、
        key expiry 静默失效（新增 R14）、不得通告 0.0.0.0/0。
      Q7: >
        【重要纠错】8cm 装不下整屏：屏幕显示区 67.13×149.17mm，66° 镜头 8cm 处仅覆盖约 56% 长边。
        新增 hardware.optics 章节（几何推导 / 距离表 / 现场测量法 / 调焦步骤 / 景深），
        mounting.camera_distance 由 8-12cm 改为 13-16cm。新增 R12（出厂合焦距离过远）。
      bom_rewrite: >
        把 bom 由 required/recommended/optional 三段重写为可直接下单的六组
        （owned / electronics_core / mechanics_optics / powered_end_devices / decide_first / later），
        并新增 purchase_spec_checklist 与 total_estimate。
        补回了四组此前完全缺失的物料：第二颗摄像头（排障用）、5V/1A 慢充头（Q5 Tier-A）、
        本地定时智能插座（Q5/R15）、13-16cm 工作距所需的刚性悬臂与调焦耗材（Q7/R12）。
        作废旧口径「总价 <¥200」，新口径 ¥225-700（中位约 ¥300）。
    corrections:
      - "纠正 v1.1-v1.3 的表述错误：径向畸变不能被单应矩阵吸收（H 只描述平面射影变换）。
         已改写 hardware.camera.lens_distortion 并新增 R13。"
      - "修复 risk_register.R7 中的 garbled 英文残留。"
      - "implementation_order.step_6 重写为有序的光学工位，并新增 step_6b 供电工位。"
      - "新增 scalability 顶层章节：记录 subnet router 的可部署性代价，以及
         零服务器 / 零公网暴露 / 部署友好「三者最多取二」的三难困境；
         给出三条路与推荐的传输层抽象方向，status 为 PROPOSED 待用户确认。"
      - "新增 network.esp32_access.self_hosted_relay_comparison：量化对比
         自建公网跳板与 subnet router（带宽路径 / 攻击面 / 成本形态 / 流量预算 /
         架构原则），结论为选 subnet router，并给出何时才该重新考虑跳板。"
      - "细化 network.esp32_access.status 的措辞：「唯一解」改为「在 server_required=false
         约束下的唯一解」，并新增 scope_note 说明远程控制在架构上必然需要一个常在线中间人，
         四个候选（厂商云 / 自带客户端 / 本地常开节点 / 公网跳板）中 ESP32 只能走后两者。"
    new_sections: "hardware.optics / tech_stack.coexistence；tech_stack 新增 coex_and_stack 与 networking_vpn 两组参考"
    new_risks: "R12 合焦距离 / R13 径向畸变 / R14 Tailscale key expiry / R15 智能插座单点故障"
    status: "剩余全部为可执行的真机验证项；无需再做桌面调研"

